[build]
  publish = "."
  functions = "netlify/functions"

# Roda de hora em hora, verificando carrinhos parados há mais de 3h
[functions."lembrete-carrinho-abandonado"]
  schedule = "@hourly"

# Roda de hora em hora: cancela pedidos Pix/cartão não pagos no prazo
# (o banco devolve saldo, cupom e estoque ao cancelar)
[functions."expirar-pedidos-pendentes"]
  schedule = "@hourly"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; media-src 'self' blob: https://kkliwdphrdbguclsvxcw.supabase.co; connect-src 'self' https://kkliwdphrdbguclsvxcw.supabase.co wss://kkliwdphrdbguclsvxcw.supabase.co https://viacep.com.br; frame-ancestors 'none'; base-uri 'self'; object-src 'none'; form-action 'self'"

# CORS só nas funções (API), restrito ao domínio do site — antes estava
# "*" (qualquer site podia chamar essas funções), agora só o Zipshop.
[[headers]]
  for = "/.netlify/functions/*"
  [headers.values]
    Access-Control-Allow-Origin = "https://zipshop.netlify.app"
    Access-Control-Allow-Methods = "GET, POST, OPTIONS"
    Access-Control-Allow-Headers = "Content-Type"

# Arquivos internos (SQL, anotações, planejamento) ficam no repositório,
# mas NUNCA são servidos pelo site. force = true vale mesmo se o arquivo existir.
[[redirects]]
  from = "/_interno/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/README.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/netlify.toml"
  to = "/404.html"
  status = 404
  force = true

# Instruções do assistente (Claude) também não são servidas pelo site
[[redirects]]
  from = "/CLAUDE.md"
  to = "/404.html"
  status = 404
  force = true
