// Escapa texto antes de colocar no HTML (evita XSS). Fica aqui, no script
// normal, para ser global: o renderCheckout e o <script type="module"> usam.
function esc(str) {
  if (str === null || str === undefined) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');
}

function formatPrice(v) { return Number(v).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' }); }

// Animação de comemoração do pedido confirmado: chuva de moedas + confete,
// pra dar aquele "gostinho de prêmio" e reforçar a compra.
function dispararCelebracao() {
  let overlay = document.getElementById('celebracao-overlay');
  if (!overlay) {
    overlay = document.createElement('div');
    overlay.id = 'celebracao-overlay';
    overlay.className = 'celebracao-overlay';
    document.body.appendChild(overlay);
  }
  overlay.innerHTML = '';

  const cores = ['#AAEF00', '#FFD23F', '#FF6B6B', '#4ECDC4', '#C084FC', '#60A5FA'];
  for (let i = 0; i < 42; i++) {
    const el = document.createElement('div');
    el.className = 'confete';
    el.style.left = (Math.random() * 100) + 'vw';
    el.style.background = cores[Math.floor(Math.random() * cores.length)];
    el.style.animationDuration = (2.1 + Math.random() * 1.3) + 's';
    el.style.animationDelay = (Math.random() * 0.5) + 's';
    overlay.appendChild(el);
  }

  const moedas = ['🪙', '💰', '💚', '💚'];
  for (let i = 0; i < 18; i++) {
    const el = document.createElement('div');
    el.className = 'moeda-cai';
    el.textContent = moedas[Math.floor(Math.random() * moedas.length)];
    el.style.left = (Math.random() * 100) + 'vw';
    el.style.fontSize = (16 + Math.random() * 16) + 'px';
    el.style.animationDuration = (1.7 + Math.random() * 1.2) + 's';
    el.style.animationDelay = (Math.random() * 0.6) + 's';
    overlay.appendChild(el);
  }

  if (navigator.vibrate) navigator.vibrate([35, 30, 35]);

  setTimeout(() => { overlay.innerHTML = ''; }, 4000);
}

// CORREÇÃO: telas travando pra sempre (ex: "Salvando pedido...") quando a
// conexão está ruim/instável. Antes, se uma chamada ao Supabase nunca
// respondesse, o site ficava preso naquele texto indefinidamente, sem
// nenhum aviso. Agora qualquer chamada crítica tem um limite de tempo —
// se estourar, mostramos um erro claro em vez de travar a tela.
function comTimeout(promise, ms = 15000, mensagem = 'A operação demorou demais. Verifique sua conexão e tente novamente.') {
  return Promise.race([
    promise,
    new Promise((_, reject) => setTimeout(() => reject(new Error(mensagem)), ms))
  ]);
}

let selectedPayment = 'pix';
let selectedDelivery = 'rota';
let selectedHorario = '';
// CORREÇÃO BUG 13: se um cupom já foi aplicado lá no carrinho, ele
// continua aplicado aqui — não precisa digitar de novo.
let _cupomAplicado = getCupomAplicado(); // { codigo, tipo, valor, id }
let _saldoDisponivel = 0;
let _usarSaldo = false;

function calcDescontoSaldo(baseAposCupom) {
  if (!_usarSaldo || _saldoDisponivel <= 0) return 0;
  return Math.min(_saldoDisponivel, baseAposCupom);
}

function calcFrete(subtotal) {
  if (selectedDelivery === 'exclusiva') return 9.90;
  // Cupom de frete grátis
  if (_cupomAplicado?.tipo === 'frete_gratis') return 0;
  return subtotal >= 14.90 ? 0 : 2.90;
}

// CORREÇÃO BUG 15 — horário de corte da Entrega Exclusiva:
// Até as 18h, a Entrega Exclusiva chega em até 3h no mesmo dia.
// Depois das 18h, as entregas do dia já acabaram — a próxima leva
// começa às 8h do dia seguinte, então o prazo passa a ser "até 3h
// depois disso", ou seja, até as 11h do dia seguinte.
function infoEntregaExclusiva() {
  const hora = new Date().getHours();
  const foraDoHorario = hora >= 18;
  return {
    foraDoHorario,
    tituloPrazo: foraDoHorario ? 'Fora do horário — até 11h de amanhã' : 'Motoboy exclusivo — até 3 horas',
    previsao: foraDoHorario ? 'Até 11h do dia seguinte' : 'Até 3 horas',
    avisoExtra: foraDoHorario
      ? '⏰ Já passou das 18h (horário de corte). Pedidos feitos agora entram na primeira rota do dia seguinte (a partir das 8h) e chegam em até 3h depois disso — ou seja, até as 11h de amanhã.'
      : '⏰ Pedida até as 18h, chega em até 3h ainda hoje. Depois das 18h, o prazo passa a ser até as 11h do dia seguinte.'
  };
}

// Desconto de 5% no PIX aplicado somente sobre o subtotal (produtos), não sobre o frete
function calcSubtotalComDesconto(subtotal) {
  return selectedPayment === 'pix' ? subtotal * 0.95 : subtotal;
}

function calcDescontoCupom(subtotalComDesconto) {
  if (!_cupomAplicado) return 0;
  if (_cupomAplicado.tipo === 'percentual') return subtotalComDesconto * (_cupomAplicado.valor / 100);
  if (_cupomAplicado.tipo === 'fixo') return Math.min(_cupomAplicado.valor, subtotalComDesconto);
  if (_cupomAplicado.tipo === 'frete_gratis') return 0;
  return 0;
}

function atualizarResumoTotal() {
  const subtotal = getCartTotal();
  const frete = calcFrete(subtotal);
  const subtotalComDesconto = calcSubtotalComDesconto(subtotal);
  const descontoCupom = calcDescontoCupom(subtotalComDesconto);
  const descontoSaldo = calcDescontoSaldo(subtotalComDesconto - descontoCupom);
  const total = subtotalComDesconto - descontoCupom - descontoSaldo + frete;

  // Desconto PIX
  const descontoPixEl = document.getElementById('resumo-desconto-pix');
  if (descontoPixEl) descontoPixEl.style.display = selectedPayment === 'pix' ? '' : 'none';

  // Desconto cupom
  const cupomEl = document.getElementById('resumo-desconto-cupom');
  const cupomValorEl = document.getElementById('resumo-cupom-valor');
  if (cupomEl && cupomValorEl) {
    if (_cupomAplicado) {
      cupomEl.style.display = '';
      if (_cupomAplicado.tipo === 'frete_gratis') cupomValorEl.textContent = 'Frete Grátis';
      else cupomValorEl.textContent = '-' + formatPrice(descontoCupom);
    } else {
      cupomEl.style.display = 'none';
    }
  }

  // Desconto saldo
  const saldoEl = document.getElementById('resumo-desconto-saldo');
  const saldoValorEl = document.getElementById('resumo-saldo-valor');
  if (saldoEl && saldoValorEl) {
    if (_usarSaldo && descontoSaldo > 0) {
      saldoEl.style.display = '';
      saldoValorEl.textContent = '-' + formatPrice(descontoSaldo);
    } else {
      saldoEl.style.display = 'none';
    }
  }

  // Frete
  const freteEl = document.getElementById('resumo-frete');
  if (freteEl) freteEl.innerHTML = `<span>Frete</span><span>${frete === 0 ? '<span style="color:#22c55e">Grátis</span>' : formatPrice(frete)}</span>`;

  const totalEl = document.getElementById('resumo-total');
  if (totalEl) totalEl.textContent = formatPrice(total);
  const btn = document.getElementById('btn-confirmar');
  if (btn) btn.textContent = `⚡ Confirmar Pedido — ${formatPrice(total)}`;
}

window.toggleUsarSaldo = function(checked) {
  _usarSaldo = checked;
  atualizarResumoTotal();
};

window.aplicarCupom = async function() {
  const codigo = (document.getElementById('campo-cupom')?.value || '').trim().toUpperCase();
  const feedback = document.getElementById('cupom-feedback');
  if (!codigo) { feedback.style.display='block'; feedback.style.color='#ef4444'; feedback.textContent='Digite um código de cupom.'; return; }

  feedback.style.display='block'; feedback.style.color='var(--text-muted)'; feedback.textContent='Verificando cupom...';

  const { createClient: _cc } = await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm');
  const _sb = _cc('https://kkliwdphrdbguclsvxcw.supabase.co', 'sb_publishable_OMXANLsZK98fPWygp8ZHfA_xzSpWgYb');
  const { data: { session: _sessCupom } } = await _sb.auth.getSession();
  const user = _sessCupom?.user || null;

  const { data: cupom, error } = await _sb.from('cupons')
    .select('*').eq('codigo', codigo).eq('ativo', true).single();

  if (error || !cupom) {
    _cupomAplicado = null; clearCupomAplicado();
    feedback.style.color='#ef4444'; feedback.textContent='❌ Cupom inválido ou não encontrado.';
    atualizarResumoTotal(); return;
  }

  // Valida expiração
  if (cupom.valido_ate && new Date(cupom.valido_ate) < new Date()) {
    _cupomAplicado = null; clearCupomAplicado();
    feedback.style.color='#ef4444'; feedback.textContent='❌ Este cupom expirou.';
    atualizarResumoTotal(); return;
  }

  // Valida uso máximo
  if (cupom.uso_maximo && cupom.uso_atual >= cupom.uso_maximo) {
    _cupomAplicado = null; clearCupomAplicado();
    feedback.style.color='#ef4444'; feedback.textContent='❌ Este cupom atingiu o limite de usos.';
    atualizarResumoTotal(); return;
  }

  // Valida uso único por usuário
  if (user && cupom.uso_unico_por_usuario) {
    const { data: jaUsou } = await _sb.from('cupons_usos')
      .select('id').eq('cupom_id', cupom.id).eq('usuario_id', user.id).single();
    if (jaUsou) {
      _cupomAplicado = null; clearCupomAplicado();
      feedback.style.color='#ef4444'; feedback.textContent='❌ Você já utilizou este cupom.';
      atualizarResumoTotal(); return;
    }
  }

  // Valida pedido mínimo
  const subtotal = getCartTotal();
  if (cupom.pedido_minimo && subtotal < cupom.pedido_minimo) {
    _cupomAplicado = null; clearCupomAplicado();
    feedback.style.color='#ef4444';
    feedback.textContent = `❌ Pedido mínimo para este cupom: ${formatPrice(cupom.pedido_minimo)}`;
    atualizarResumoTotal(); return;
  }

  _cupomAplicado = { id: cupom.id, codigo: cupom.codigo, tipo: cupom.tipo, valor: cupom.valor };
  // CORREÇÃO BUG 13: persiste o cupom aplicado aqui também, pra ele
  // não "sumir" se o cliente voltar pro carrinho ou recarregar a página.
  setCupomAplicado(_cupomAplicado);

  const desc = cupom.tipo === 'percentual' ? `${cupom.valor}% de desconto`
    : cupom.tipo === 'fixo' ? `R$ ${cupom.valor} de desconto`
    : 'Frete Grátis';
  feedback.style.color='#22c55e'; feedback.textContent=`✅ Cupom aplicado! ${desc}`;
  atualizarResumoTotal();
};

function mascaraTelefone(input) {
  let v = input.value.replace(/\D/g,'');
  if (v.length <= 10) v = v.replace(/(\d{2})(\d{4})(\d{0,4})/,'($1) $2-$3');
  else v = v.replace(/(\d{2})(\d{5})(\d{0,4})/,'($1) $2-$3');
  input.value = v;
}

function mascaraCEP(input) {
  let v = input.value.replace(/\D/g,'').slice(0,8);
  if (v.length > 5) v = v.replace(/(\d{5})(\d{1,3})/, '$1-$2');
  input.value = v;
  if (v.replace(/\D/g,'').length === 8) buscarCEP();
}

async function buscarCEP() {
  const cep = (document.getElementById('campo-cep')?.value || '').replace(/\D/g,'');
  const feedback = document.getElementById('cep-feedback');
  if (cep.length !== 8) return;
  feedback.style.display = 'block';
  feedback.style.color = 'var(--text-muted)';
  feedback.textContent = 'Buscando endereço...';
  try {
    const res = await fetch('https://viacep.com.br/ws/' + cep + '/json/');
    const data = await res.json();
    if (data.erro) {
      feedback.style.color = '#ef4444';
      feedback.textContent = '❌ CEP não encontrado.';
      return;
    }
    const rua = document.getElementById('campo-rua');
    const bairro = document.getElementById('campo-bairro');
    if (rua && !rua.value) rua.value = data.logradouro || '';
    else if (rua) rua.value = data.logradouro || rua.value;
    if (bairro && !bairro.value) bairro.value = data.bairro || '';
    else if (bairro) bairro.value = data.bairro || bairro.value;
    feedback.style.color = '#22c55e';
    feedback.textContent = '✅ Endereço encontrado — confira e edite se necessário.';
    document.getElementById('campo-numero')?.focus();
  } catch(e) {
    feedback.style.color = '#ef4444';
    feedback.textContent = '❌ Erro ao buscar CEP. Tente novamente.';
  }
}

async function finalizarPedido() {
  const nome = document.getElementById('campo-nome')?.value.trim();
  const telefone = document.getElementById('campo-telefone')?.value.trim();
  const bairro = document.getElementById('campo-bairro')?.value.trim();
  const rua = document.getElementById('campo-rua')?.value.trim();
  const numero = document.getElementById('campo-numero')?.value.trim();
  const complemento = document.getElementById('campo-complemento')?.value.trim();
  const referencia = document.getElementById('campo-referencia')?.value.trim();
  const endereco = rua && numero ? `${rua}, ${numero}${complemento ? ' - ' + complemento : ''}` : '';

  if (!document.getElementById('aceite-termos')?.checked) { showToast('Você precisa aceitar os Termos de Uso', 'error'); return; }
  if (!nome) { showToast('Digite seu nome completo', 'error'); return; }
  if (!validarTelefone(telefone)) { showToast('Digite um telefone válido com DDD (ex: 55 99999-9999)', 'error'); return; }
  if (!bairro) { showToast('Digite seu bairro', 'error'); return; }
  if (!rua) { showToast('Digite o nome da rua', 'error'); return; }
  if (!numero) { showToast('Digite o número da residência', 'error'); return; }

  const itens = cart.map(item => ({

    await supabase.from('cupons').update({ uso_atual: supabase.rpc ? undefined : undefined }).eq('id', _cupomAplicado.id);

  }

  if (descontoSaldo > 0) {
    await supabase.from('saldo_extrato').insert({
      usuario_id: user.id,
      pedido_id: pedido.id,
      tipo: 'resgate',

    }).catch(() => {});

      <h1>Pedido Confirmado!</h1>
      <p style="font-size:18px;font-weight:700;margin-bottom:4px">#${pedidoIdCurto}</p>
      <div class="order-info-card">
        <div class="order-info-row">
          <div class="order-info-icon">📍</div>
          <div class="order-info-text">
            <div class="order-info-label">Endereço</div>

        </div>

          <div class="order-info-text">
            <div class="order-info-label">Pagamento</div>
            <div class="order-info-value">Na entrega — dinheiro trocado</div>
          </div>
        </div>
        <div class="order-info-row">
          <div class="order-info-icon">🔑</div>
          <div class="order-info-text">
            <div class="order-info-label">Código de confirmação</div>
            <div class="order-info-value">${pedido.codigo_confirmacao} — informe pro entregador na hora da entrega</div>
          </div>
        </div>
        <div class="order-info-note">

        </div>
      </div>
      <p style="font-size:12px;color:var(--text-muted);margin-bottom:24px">Você receberá uma confirmação em breve.</p>
      <div style="display:flex;gap:12px">
        <a href="conta.html" class="btn btn-outline" style="flex:1">Meus Pedidos</a>
        <a href="index.html" class="btn btn-primary" style="flex:1">Continuar Comprando</a>
      </div>
    </div>`;
    window.scrollTo(0,0);
    dispararCelebracao();
    import('/js/analytics.js').then(m => m.registrarEvento('compra_concluida', { meta: { pedidoId: pedido.id, total: pedido.total } })).catch(() => {});
    return;
  }

  // PIX ou Cartão → Mercado Pago
  btn.textContent = 'Redirecionando para pagamento...';

  // Detecta se está rodando localmente (Live Server)
  const isLocal = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
  if (isLocal) {
    clearCart();
    document.getElementById('main-content').innerHTML = `
    <div class="success-box">
      <div class="success-icon">✅</div>
      <h1>Pedido Salvo!</h1>
      <p style="font-size:15px;font-weight:700;margin-bottom:8px">#${pedidoIdCurto}</p>
      <div style="background:rgba(245,158,11,0.1);border:1px solid rgba(245,158,11,0.3);border-radius:12px;padding:14px;margin-bottom:20px">
        <p style="font-size:13px;color:#f59e0b;font-weight:700">⚠️ Ambiente Local (Live Server)</p>
        <p style="font-size:12px;color:var(--text-muted);margin-top:4px">O pagamento via Mercado Pago só funciona quando o site está publicado no Netlify. Pedido salvo no banco com sucesso!</p>

        <a href="conta.html" class="btn btn-outline" style="flex:1">Meus Pedidos</a>

      </div>
    </div>`;
    window.scrollTo(0,0);
    return;
  }

  try {
    const mpResponse = await comTimeout(
      fetch('/.netlify/functions/criar-pagamento', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + ((await supabase.auth.getSession()).data.session?.access_token || '') },
        body: JSON.stringify({ pedidoId, email: user.email })
      }),
      15000, 'Não conseguimos conectar com o pagamento a tempo. Tente novamente.'
    );

    const mpData = await mpResponse.json();
    if (mpData.erro) throw new Error(mpData.erro);
    // Não limpa o carrinho aqui — só quando o pagamento for confirmado (tela "aprovado")
    // Isso evita que o cliente fique travado se desistir/voltar do Mercado Pago
    window.location.href = mpData.url;

  } catch (err) {
    btn.disabled = false; btn.textContent = '⚡ Confirmar Pedido';
    showToast(err.message || 'Erro ao conectar com pagamento. Tente novamente.', 'error');
  }
}
</script>
