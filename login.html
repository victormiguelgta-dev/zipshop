<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="base" content="">
  <title>Entrar — Zipshop</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="navbar"></div>

<div class="auth-page" id="auth-page" style="display:none">
  <div class="auth-box">
    <div class="auth-logo">
      <img src="img/logo-icon.jpeg" alt="Zipshop" onerror="this.style.display='none'">
      <div class="logo-text" style="font-size:22px;justify-content:center;display:flex"><span>ZIP</span><span>SHOP</span></div>
      <h1 style="font-size:22px;font-weight:900;margin-top:8px">Bem-vindo de volta</h1>
      <p class="subtitle">Entre na sua conta para continuar</p>
    </div>
    <div class="auth-card">
      <div id="msg-erro" style="display:none;background:#fee2e2;color:#b91c1c;padding:10px 14px;border-radius:8px;font-size:13px;margin-bottom:12px;font-weight:600"></div>
      <form id="form-login">
        <div class="form-group">
          <label class="form-label">E-mail</label>
          <input type="email" class="form-input" id="email" placeholder="seu@email.com" required>
        </div>
        <div class="form-group">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
            <label class="form-label" style="margin:0">Senha</label>
            <a href="#" id="link-esqueci" style="color:var(--primary);font-size:12px;font-weight:700">Esqueceu a senha?</a>
          </div>
          <div class="input-wrapper">
            <input type="password" class="form-input" id="password" placeholder="Sua senha" required>
            <button type="button" class="show-pass" onclick="togglePass('password', this)">👁️</button>
          </div>
        </div>
        <button type="submit" class="btn btn-primary btn-full" id="btn-login" style="margin-top:4px">Entrar</button>
      </form>
      <div class="auth-divider">ou continue com</div>
      <button class="btn btn-outline btn-full" id="btn-google">
        <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
        Continuar com Google
      </button>
    </div>
    <div class="auth-footer">Não tem uma conta? <a href="cadastro.html">Criar conta grátis</a></div>
  </div>
</div>

<div id="footer"></div>

<script src="js/data.js"></script>
<script src="js/cart.js"></script>
<script src="js/main.js"></script>
<script type="module">
  import { supabase, salvarPerfil } from './js/supabase-config.js';

  // E-mails com acesso admin (deve ser igual à lista em admin-guard.js e main.js)
  const ADMIN_EMAILS = ['victormiguelgta@gmail.com', 'admin@zipshop.com'];

  function getDestino(userObj) {
    const params = new URLSearchParams(window.location.search);
    if (params.get('redirect') === 'checkout') return 'checkout.html';
    if (ADMIN_EMAILS.includes(userObj?.email)) return 'admin/index.html';
    return 'conta.html';
  }

  // Valida formato real de e-mail antes de prosseguir
  function validarEmail(email) {
    const regex = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;
    return regex.test(String(email || '').trim());
  }

  // getSession() lê a sessão salva localmente na hora — não depende de
  // uma chamada de rede terminar a tempo. Era isso que causava aquele
  // "pisca": a página de login aparecia rapidinho antes da checagem
  // (mais lenta, via getUser()) confirmar que o usuário já estava
  // logado e mandar de volta pra conta.
  const { data: { session: sessaoInicial } } = await supabase.auth.getSession();
  const user = sessaoInicial?.user || null;
  if (user) {
    // replace() em vez de href: não deixa a página de login no
    // histórico, então o botão "voltar" do navegador não traz de
    // volta pra ela depois — evitava um "quique" entre conta e login.
    window.location.replace(getDestino(user));
  } else {
    // Só mostra o formulário depois de confirmar que realmente não
    // há sessão — antes disso ele ficava escondido, então ninguém
    // via o login "piscar" antes do redirecionamento pra conta.
    document.getElementById('auth-page').style.display = '';
  }

  function mostrarErro(msg) {
    const el = document.getElementById('msg-erro');
    el.textContent = msg;
    el.style.display = 'block';
  }

  document.getElementById('form-login').addEventListener('submit', async (e) => {
    e.preventDefault();
    document.getElementById('msg-erro').style.display = 'none';

    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;

    if (!validarEmail(email)) { mostrarErro('Digite um e-mail válido.'); return; }

    const btn = document.getElementById('btn-login');
    btn.disabled = true; btn.textContent = 'Entrando...';

    const { data, error } = await supabase.auth.signInWithPassword({ email, password });

    btn.disabled = false; btn.textContent = 'Entrar';

    if (error) {
      const msgs = {
        'Invalid login credentials': 'E-mail ou senha incorretos.',
        'Email not confirmed': 'Confirme seu e-mail antes de entrar.',
        'Too many requests': 'Muitas tentativas. Aguarde alguns minutos.'
      };
      mostrarErro(msgs[error.message] || 'Erro ao entrar. Tente novamente.');
      return;
    }

    await salvarPerfil(data.user);
    showToast('Login realizado com sucesso!', 'success');
    setTimeout(() => window.location.replace(getDestino(data.user)), 1000);
  });

  document.getElementById('btn-google').addEventListener('click', async () => {
    // Redireciona para uma página intermediária que detecta se é admin
    await supabase.auth.signInWithOAuth({
      provider: 'google',
      options: { redirectTo: window.location.origin + '/login.html?oauth=1' }
    });
  });

  document.getElementById('link-esqueci').addEventListener('click', async (e) => {
    e.preventDefault();
    const email = document.getElementById('email').value;
    if (!email) { mostrarErro('Digite seu e-mail primeiro.'); return; }
    if (!validarEmail(email)) { mostrarErro('Digite um e-mail válido.'); return; }
    await supabase.auth.resetPasswordForEmail(email, {
      redirectTo: window.location.origin + '/conta.html'
    });
    showToast('E-mail de recuperação enviado!', 'success');
  });

  window.togglePass = function(id, btn) {
    const input = document.getElementById(id);
    if (input.type === 'password') { input.type = 'text'; btn.textContent = '🙈'; }
    else { input.type = 'password'; btn.textContent = '👁️'; }
  };
</script>
</body>
</html>
