<!DOCTYPE html>
<html lang="pt-BR">
<head>
<link rel="preconnect" href="https://kkliwdphrdbguclsvxcw.supabase.co">
<link rel="dns-prefetch" href="https://kkliwdphrdbguclsvxcw.supabase.co">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="base" content="">
  <title>Meu Saldo — Zipshop</title>
  <link rel="stylesheet" href="css/style.css">
<script>function esc(s){return s==null?"":String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;");}</script>
</head>
<body>
<div id="navbar"></div>

<div class="page-hero">
  <div class="container">
    <div class="breadcrumb"><a href="index.html">Home</a><span>/</span><span>Meu Saldo</span></div>
    <h1>💰 Meu Saldo</h1>
  </div>
</div>

<div class="container" style="max-width:680px;padding:24px 16px 64px">

  <!-- Saldo disponível -->
  <div class="card" style="margin-bottom:20px;background:linear-gradient(135deg,rgba(170,239,0,0.14),rgba(170,239,0,0.03))">
    <div class="card-body" style="text-align:center;padding:28px 20px">
      <p style="font-size:12px;color:var(--text-muted);text-transform:uppercase;font-weight:700;letter-spacing:.05em">Saldo disponível</p>
      <p id="saldo-total" style="font-size:38px;font-weight:900;color:var(--primary);margin-top:6px">R$ 0,00</p>
      <p style="font-size:12px;color:var(--text-muted);margin-top:6px">Use na próxima compra pra abater no total, direto no carrinho.</p>
    </div>
  </div>

  <!-- Código de indicação -->
  <div class="card" style="margin-bottom:20px">
    <div class="card-body">
      <p style="font-weight:700;margin-bottom:4px">🤝 Indique e ganhe</p>
      <p style="font-size:13px;color:var(--text-muted);margin-bottom:14px">Compartilhe seu link. Quando alguém comprar por ele, você ganha uma comissão em saldo — automaticamente, sem precisar fazer nada.</p>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <input type="text" id="link-indicacao" readonly style="flex:1;min-width:180px;background:var(--bg-muted);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:10px 12px;font-size:13px">
        <button onclick="copiarLinkIndicacao()" class="btn btn-primary btn-sm">📋 Copiar link</button>
      </div>
    </div>
  </div>

  <!-- Extrato -->
  <p style="font-weight:900;font-size:15px;margin-bottom:10px">Extrato</p>
  <div id="extrato-lista">
    <div style="padding:40px;text-align:center;color:var(--text-muted)">Carregando...</div>
  </div>
</div>

<div id="footer"></div>
<script src="js/cart.js"></script>
<script src="js/main.js"></script>
<script type="module">
import { supabase } from './js/supabase-config.js';

const { data: { session } } = await supabase.auth.getSession();
const user = session?.user || null;

if (!user) {
  window.location.href = 'login.html?redirect=saldo.html';
}

function formatPrice(v) { return Number(v || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' }); }

async function carregarSaldo() {
  const { data: usuario } = await supabase.from('usuarios').select('codigo_indicacao').eq('id', user.id).single();
  const codigo = usuario?.codigo_indicacao;
  if (codigo) {
    document.getElementById('link-indicacao').value = `${location.origin}${location.pathname.replace('saldo.html','index.html')}?ref=${codigo}`;
  } else {
    document.getElementById('link-indicacao').value = 'Gerando seu código...';
  }

  const { data: extrato } = await supabase
    .from('saldo_extrato')
    .select('*')
    .eq('usuario_id', user.id)
    .order('criado_em', { ascending: false });

  const total = (extrato || []).reduce((s, e) => s + Number(e.valor), 0);
  document.getElementById('saldo-total').textContent = formatPrice(total);

  const lista = document.getElementById('extrato-lista');
  if (!extrato?.length) {
    lista.innerHTML = `<div class="card"><div class="card-body" style="text-align:center;padding:48px">
      <p style="font-size:40px;margin-bottom:12px">💰</p>
      <p style="font-weight:700;margin-bottom:8px">Nenhuma movimentação ainda</p>
      <p style="color:var(--text-muted)">Compre produtos com cashback ou indique amigos pra começar a acumular saldo.</p>
    </div></div>`;
    return;
  }

  const rotulos = { cashback: '💰 Cashback', indicacao: '🤝 Indicação', resgate: '🛒 Usado numa compra' };
  lista.innerHTML = extrato.map(e => `
    <div class="card" style="margin-bottom:8px">
      <div class="card-body" style="display:flex;justify-content:space-between;align-items:center;padding:14px 16px">
        <div>
          <p style="font-size:13px;font-weight:700">${rotulos[e.tipo] || e.tipo}</p>
          <p style="font-size:12px;color:var(--text-muted);margin-top:2px">${esc(e.descricao || '')}</p>
          <p style="font-size:11px;color:var(--text-muted);margin-top:2px">${new Date(e.criado_em).toLocaleDateString('pt-BR', { day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit' })}</p>
        </div>
        <p style="font-weight:900;font-size:15px;color:${e.valor >= 0 ? 'var(--primary)' : '#ef4444'}">${e.valor >= 0 ? '+' : ''}${formatPrice(e.valor)}</p>
      </div>
    </div>`).join('');
}

window.copiarLinkIndicacao = function() {
  const input = document.getElementById('link-indicacao');
  navigator.clipboard.writeText(input.value).then(() => showToast('Link copiado!', 'success'));
};

carregarSaldo();
</script>
</body>
</html>
