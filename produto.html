<script type="module">
function esc(str) {
  if (str === null || str === undefined) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');
}

import { supabase } from './js/supabase-config.js';
import { getProduct, formatPrice, starsHTML, variacoesDe, precoVariacao, variacaoDisponivel, percentualDesconto } from './js/data.js';
import { getFavoritosIds, toggleFavorito } from './js/favoritos.js';
import { registrarEvento } from './js/analytics.js';

const id = new URLSearchParams(location.search).get('id');
let qty = 1;
let _corSelecionada = null;
let _variacaoSelecionada = null;

// Ícones de linha (no lugar dos emojis)
const svg = d => `<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
const ICO = {
  cartao: svg('<rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20M6 15h4"/>'),
  carteira: svg('<path d="M20 7V5a2 2 0 0 0-2-2H5a2 2 0 0 0 0 4h15v13H5a2 2 0 0 1-2-2V5"/><path d="M16 13h.01"/>'),
  pessoas: svg('<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>'),
  caminhao: svg('<path d="M1 3h15v13H1zM16 8h4l3 3v5h-7z"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/>'),
  raio: svg('<path d="M13 2 3 14h9l-1 8 10-12h-9z"/>'),
  seta: '<span class="pd-seta">' + svg('<path d="m9 18 6-6-6-6"/>') + '</span>',
  carrinho: svg('<circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.7 13.4a2 2 0 0 0 2 1.6h9.7a2 2 0 0 0 2-1.6L23 6H6"/>'),
  cadeado: svg('<rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>'),
  troca: svg('<path d="M23 4v6h-6M1 20v-6h6"/><path d="M3.5 9a9 9 0 0 1 14.9-3.4L23 10M1 14l4.6 4.4A9 9 0 0 0 20.5 15"/>'),
  escudo: svg('<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>')
};

// Corte da logística: pedidos até as 20h saem no dia seguinte (horário de Brasília)
const HORA_CORTE = 20;
function textoEntrega() {
  const agora = new Date(new Date().toLocaleString('en-US', { timeZone: 'America/Sao_Paulo' }));
  const corte = new Date(agora); corte.setHours(HORA_CORTE, 0, 0, 0);
  const falta = corte - agora;
  if (falta <= 0) {
    return `<strong>Entrega em até 2 dias</strong><span>Pedidos após as ${HORA_CORTE}h entram na separação de amanhã</span>`;
  }
  const h = Math.floor(falta / 3600000), m = Math.floor((falta % 3600000) / 60000);
  const resta = h > 0 ? `${h}h${m ? ' ' + m + 'min' : ''}` : `${m}min`;
  return `<strong>Entrega amanhã</strong><span>Peça em até ${resta} para garantir</span>`;
}
setInterval(() => { const el = document.getElementById('entrega-texto'); if (el) el.innerHTML = textoEntrega(); }, 60000);

window.alternarInfo = function(id, btn) {
  const el = document.getElementById(id);
  if (!el) return;
  el.hidden = !el.hidden;
  btn.classList.toggle('aberto', !el.hidden);
};

async function render() {
  // Internet ruim: tenta de novo antes de desistir
  let p = await getProduct(id);
  if (!p && id) { await new Promise(r => setTimeout(r, 1200)); p = await getProduct(id); }
  window._produto = p;
  if (!p) {
    document.getElementById('content').innerHTML = `<div style="text-align:center;padding:80px 16px"><p style="color:var(--text-muted)">${icone('busca', 48)}</p><h2 style="margin:16px 0 8px">Produto não encontrado</h2><p style="color:var(--text-muted);margin-bottom:16px">Ele pode ter saído da loja, ou a internet falhou.</p><div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap"><button class="btn btn-outline" onclick="location.reload()">Tentar de novo</button><a href="produtos.html" class="btn btn-primary">Ver Produtos</a></div></div>`;
    return;
  }
  registrarEvento('visualizacao_produto', { produtoId: p.id });
  document.title = p.name + ' — Zipshop';
  // specs pode vir como lista [{nome, valor}] (novo, mantém a ordem) ou objeto (antigo)
  const listaSpecs = Array.isArray(p.specs) ? p.specs
    : Object.entries(p.specs || {}).map(([nome, valor]) => ({ nome, valor }));
  const specs = listaSpecs.filter(s => s && s.nome)
    .map(s => `<tr><td>${esc(s.nome)}</td><td>${esc(s.valor)}</td></tr>`).join('');

  // Cores (se o produto tiver variações)
  const cores = (p.cores || []).map(c => ({ ...c, nome: String(c.nome || '').replace(/[\s:—–-]+$/, '') })).filter(c => c.nome);

  // Galeria: imagem de capa (image_url) + fotos extras (imagens).
  // Sempre mostra pelo menos a capa como primeira miniatura.
  // Produtos antigos guardavam as fotos extras como texto (só a URL), e
  // não como {url, thumb} — por isso apareciam miniaturas quebradas "?".
  // Aqui aceita os dois formatos, ignora itens vazios e fotos repetidas.
  const galeria = [];
  const urlsVistas = new Set();
  [
    p.image_url ? { url: p.image_url, thumb: p.image_thumb_url } : null,
    ...(Array.isArray(p.imagens) ? p.imagens : [])
  ].forEach(item => {
    const url = typeof item === 'string' ? item : item?.url;
    if (!url || typeof url !== 'string' || urlsVistas.has(url)) return;
    urlsVistas.add(url);
    galeria.push({ url, thumb: (typeof item === 'object' && item.thumb) || url });
  });
  const galeriaHTML = galeria.length > 1 ? `
    <div class="pd-miniaturas" id="pd-miniaturas">
      ${galeria.map((img, i) => `
        <button type="button" onclick="irParaFoto(${i})" class="${i === 0 ? 'ativa' : ''}" aria-label="Foto ${i + 1}">
          <img src="${img.thumb || img.url}" loading="lazy" alt="" onerror="this.closest('button').remove()">
        </button>`).join('')}
    </div>` : '';
  const descontoPct = percentualDesconto(p);

  // Variações/kits com preço e estoque próprios: substituem as cores
  const variacoes = variacoesDe(p);
  const temControleEstoque = !variacoes.length && p.stock !== null && p.stock !== undefined;
  const semEstoque = variacoes.length ? !variacoes.some(variacaoDisponivel) : (temControleEstoque && p.stock <= 0);
  let estoqueHTML = '';
  if (semEstoque) {
    estoqueHTML = `<p style="font-size:13px;color:#ef4444;font-weight:700;margin-bottom:16px;display:flex;align-items:center;gap:6px">${icone('xCirculo', 16)} Fora de estoque no momento</p>`;
  } else if (temControleEstoque && p.stock <= 5) {
    estoqueHTML = `<p style="font-size:13px;color:#f59e0b;font-weight:700;margin-bottom:16px;display:flex;align-items:center;gap:6px">${icone('alerta', 16)} Últimas ${p.stock} unidades!</p>`;
  } else {
    estoqueHTML = `<div style="margin-bottom:16px"></div>`;
  }

  // Cor/opção: um botão só ("Cor: escolha ›") que abre a lista numa gaveta
  // que sobe de baixo, igual ao modelo do cliente.
  const gavetaOpcoes = (rotulo, conteudo) => `
    <button type="button" class="pd-opcao-btn" id="pd-opcao-btn" onclick="abrirOpcoes()">
      <span class="pd-opcao-rotulo">${rotulo}:</span>
      <span class="pd-opcao-valor" id="opcao-escolhida">escolha uma</span>
      ${icone('chevron', 18)}
    </button>
    <div class="pd-sheet-fundo" id="pd-sheet-fundo" onclick="fecharOpcoes()" hidden></div>
    <div class="pd-sheet" id="pd-sheet" aria-hidden="true">
      <div class="pd-sheet-topo"><strong>Escolha ${rotulo.toLowerCase() === 'cor' ? 'a cor' : 'uma opção'}</strong>
        <button type="button" class="pd-sheet-fechar" onclick="fecharOpcoes()" aria-label="Fechar">${icone('x', 16)}</button></div>
      ${conteudo}
    </div>`;

  const variacoesHTML = variacoes.length ? gavetaOpcoes('Opção', `
      <div class="pd-sheet-lista" id="variacoes-container">
        ${variacoes.map((v, i) => {
          const disp = variacaoDisponivel(v);
          return `<button type="button" onclick="selecionarVariacao(${i})" id="var-${i}" ${disp ? '' : 'disabled'} class="pd-sheet-item${disp ? '' : ' esgotada'}">
            <span class="pd-sheet-nome">${esc(v.nome)}</span>
            <span class="pd-sheet-preco">${Number(v.preco_antigo) > precoVariacao(p, v) ? `<s>${formatPrice(Number(v.preco_antigo))}</s> ` : ''}${formatPrice(precoVariacao(p, v))}${disp ? '' : ' · esgotado'}</span>
          </button>`;
        }).join('')}
      </div>`) : '';

  const coresHTML = !variacoes.length && cores.length ? gavetaOpcoes('Cor', `
      <div class="pd-sheet-lista" id="cores-container">
        ${cores.map((c, i) => `
          <button type="button" onclick="selecionarCor(this.dataset.nome, this)" data-nome="${esc(c.nome)}" id="cor-${i}" class="pd-sheet-item">
            <span class="pd-sheet-nome">${c.hex ? `<span class="pd-cor-bolinha" style="background:${esc(c.hex)}"></span>` : ''}${esc(c.nome)}</span>
          </button>`).join('')}
      </div>`) : '';

  document.getElementById('content').innerHTML = `
    <div class="detail-layout">
      <div>
        <div class="detail-img pd-carrossel-box" id="detail-img-wrap" style="background:${galeria.length ? '#fff' : 'linear-gradient(135deg,#1e3a6e,#2563eb)'}">
          ${galeria.length ? `
          <div class="pd-carrossel" id="pd-carrossel">
            ${galeria.map((img, i) => `<img src="${img.url}" alt="${esc(p.name)}" ${i === 0 ? 'id="detail-main-img"' : 'loading="lazy"'} draggable="false" onclick="abrirImagemCheia(this.src)">`).join('')}
          </div>
          ${galeria.length > 1 ? `<span class="pd-contador" id="pd-contador">1/${galeria.length}</span>` : ''}` : `<span style="font-size:140px">${p.emoji ? esc(p.emoji) : icone('caixa', 120)}</span>`}
          <span class="pd-selo-desconto" id="pd-selo-desconto" ${descontoPct > 0 && !variacoes.length ? '' : 'hidden'}>-${descontoPct}%</span>
        </div>
        ${galeriaHTML}
      </div>
      <div>
        <div style="font-size:12px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px">${p.brand}</div>
        <h1 class="detail-title">${p.name}</h1>
        ${p.reviews > 0 ? `<div style="display:flex;align-items:center;gap:8px;margin-bottom:16px">
          <span class="av-estrelas av-estrelas-p">${[1,2,3,4,5].map(n => `<span class="av-estrela${n <= Math.round(p.rating) ? ' cheia' : ''}">${icone('coracao', 16)}</span>`).join('')}</span>
          <span class="stars-count">${Number(p.rating).toFixed(1)} (${p.reviews} ${p.reviews === 1 ? 'avaliação' : 'avaliações'})</span>
        </div>` : '<div style="margin-bottom:12px"></div>'}
        <div class="detail-price-old" id="detail-price-old" ${p.oldPrice && !variacoes.length ? '' : 'hidden'}>${p.oldPrice ? formatPrice(p.oldPrice) : ''}</div>
        <div class="detail-price" id="detail-price">${variacoes.length ? '<span style="font-size:14px;font-weight:600;color:var(--text-muted)">a partir de </span>' : ''}${formatPrice(p.price)}</div>
        <div class="detail-installment pd-parcela">${ICO.cartao}<span id="detail-installment">ou 12x de ${formatPrice(p.price/12)} sem juros</span></div>
        ${p.cashback_percentual > 0 || p.indicacao_percentual > 0 ? `
        <div class="pd-card pd-beneficios-linha">
          <button type="button" class="pd-card-topo" onclick="alternarInfo('info-beneficios', this)">
            ${p.cashback_percentual > 0 ? `<span class="pd-ben-item">${icone('carteira', 16)} <span><b id="valor-cashback">${formatPrice(p.price * p.cashback_percentual / 100)}</b> de volta</span></span>` : ''}
            ${p.cashback_percentual > 0 && p.indicacao_percentual > 0 ? '<span class="pd-ben-sep"></span>' : ''}
            ${p.indicacao_percentual > 0 ? `<span class="pd-ben-item">${icone('pessoas', 16)} <span>Indique: <b id="valor-indicacao">${formatPrice(p.price * p.indicacao_percentual / 100)}</b></span></span>` : ''}
            ${ICO.seta}
          </button>
          <div class="pd-info" id="info-beneficios" hidden>
            ${p.cashback_percentual > 0 ? '<p><b>Cashback:</b> o valor entra como saldo na sua conta quando o pedido é entregue e pode ser usado na próxima compra.</p>' : ''}
            ${p.indicacao_percentual > 0 ? '<p><b>Indique e ganhe:</b> compartilhe seu link; quando alguém compra por ele e o pedido é entregue, você ganha o valor em saldo.</p><button type="button" class="pd-link" onclick="compartilharIndicacao(this)">Copiar meu link</button>' : ''}
          </div>
        </div>` : ''}
        <hr class="detail-divider">
        ${p.tipo_estoque === 'dropshipping' ? `
        <div class="pd-card pd-entrega pd-entrega-azul">
          <button type="button" class="pd-card-topo" onclick="alternarInfo('info-entrega', this)">
            <span class="pd-ico">${ICO.caminhao}</span>
            <span class="pd-entrega-texto"><strong>Entrega em 5 a 15 dias</strong><span>Enviado direto do fornecedor</span></span>
            ${ICO.seta}
          </button>
          <div class="pd-info" id="info-entrega" hidden><p>Este produto sai direto do fornecedor. Você acompanha cada etapa em Meus Pedidos.</p></div>
        </div>` : `
        <div class="pd-card pd-entrega">
          <button type="button" class="pd-card-topo" onclick="alternarInfo('info-entrega', this)">
            <span class="pd-ico">${ICO.raio}</span>
            <span class="pd-entrega-texto" id="entrega-texto">${textoEntrega()}</span>
            ${ICO.seta}
          </button>
          <div class="pd-info" id="info-entrega" hidden><p>Pedidos feitos até as ${HORA_CORTE}h entram na separação do dia e são entregues no dia seguinte. Depois das ${HORA_CORTE}h, entram na separação de amanhã.</p></div>
        </div>`}

        ${variacoesHTML}
        ${coresHTML}

        <div class="detail-label">Quantidade</div>
        <div class="qty-control" style="margin-bottom:8px">
          <button class="qty-btn" onclick="changeQty(-1)">−</button>
          <span class="qty-num" id="qty-display">1</span>
          <button class="qty-btn" onclick="changeQty(1)">+</button>
        </div>
        <div id="estoque-info">${estoqueHTML}</div>
        <div style="display:flex;gap:12px;margin-bottom:12px">
          <button class="btn btn-primary btn-lg pd-btn-ico" style="flex:1${semEstoque ? ';opacity:.5;cursor:not-allowed' : ''}" onclick="doAddToCart(event)" ${semEstoque ? 'disabled' : ''}>${ICO.carrinho} Adicionar ao Carrinho</button>
          <button id="btn-fav-detalhe" onclick="toggleFavoritoDetalhe(${p.id})" class="btn btn-outline btn-lg" style="width:52px;flex:0" aria-label="Favoritar">${iconeFav(false, 22)}</button>
        </div>
        <a href="carrinho.html" class="btn btn-outline btn-lg pd-btn-comprar pd-btn-ico" onclick="${semEstoque ? 'event.preventDefault()' : 'if (!doAddToCart(event)) event.preventDefault()'}" ${semEstoque ? 'style="opacity:.5;cursor:not-allowed;pointer-events:none"' : ''}>${ICO.raio} Comprar agora</a>
        <div class="pd-garantias">
          <span>${ICO.cadeado} Compra 100% segura</span>
          <span>${ICO.troca} 30 dias para troca</span>
          ${p.garantia ? `<span>${ICO.escudo} Garantia ${esc(p.garantia)}</span>` : ''}
        </div>
      </div>
    </div>

    <!-- TABS -->
    <div style="max-width:1200px;margin:0 auto;padding:0 16px 32px">
      <div style="display:flex;border-bottom:1px solid var(--border);margin-bottom:24px;gap:0">
        <button onclick="showTab('desc')" id="tab-desc" style="padding:12px 20px;background:none;border:none;border-bottom:2px solid var(--primary);color:var(--primary);font-weight:700;cursor:pointer;font-size:14px">Descrição</button>
        <button onclick="showTab('specs')" id="tab-specs" style="padding:12px 20px;background:none;border:none;border-bottom:2px solid transparent;color:var(--text-muted);cursor:pointer;font-size:14px">Especificações</button>
        <button onclick="showTab('avaliacoes')" id="tab-avaliacoes" style="padding:12px 20px;background:none;border:none;border-bottom:2px solid transparent;color:var(--text-muted);cursor:pointer;font-size:14px">Avaliações</button>
      </div>
      <div id="pane-desc">
        <div style="background:var(--bg-card);border:1px solid var(--primary);border-radius:var(--radius-lg);padding:24px">
          <p class="pd-desc-texto fechada" id="pd-desc-texto" style="color:var(--text-muted);line-height:1.8">${p.desc}</p>
          <button type="button" class="pd-ver-mais" id="pd-ver-mais" hidden onclick="alternarDescricao()">Ver mais ${icone('chevronBaixo', 16)}</button>
        </div>
      </div>
      <div id="pane-specs" style="display:none">
        <div style="background:var(--bg-card);border:1px solid var(--primary);border-radius:var(--radius-lg);padding:24px">
          ${specs ? `<table class="spec-table">${specs}</table>` : '<p style="color:var(--text-muted);font-size:13px">Este produto ainda não tem especificações cadastradas.</p>'}
        </div>
      </div>
      <div id="pane-avaliacoes" style="display:none">
        <div id="avaliacoes-content">
          <div style="padding:40px;text-align:center;color:var(--text-muted)">Carregando avaliações...</div>
        </div>
      </div>
    </div>

    <!-- PRODUTOS RELACIONADOS (vinculados no admin) -->
    <div id="relacionados-section" style="max-width:1200px;margin:0 auto;padding:0 16px 32px;display:none">
      <h2 style="font-size:18px;font-weight:900;margin-bottom:16px">Produtos Relacionados</h2>
      <div id="relacionados-grid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px"></div>
    </div>

    <!-- VOCÊ TAMBÉM PODE GOSTAR (mesma categoria) -->
    <div id="tbm-section" style="max-width:1200px;margin:0 auto;padding:0 16px 64px;display:none">
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:16px">
        <div style="flex:1;height:1px;background:var(--border)"></div>
        <h2 style="font-size:16px;font-weight:900;white-space:nowrap">Você Também Pode Gostar</h2>
        <div style="flex:1;height:1px;background:var(--border)"></div>
      </div>
      <div id="tbm-grid" style="display:grid;grid-template-columns:repeat(2,1fr);gap:10px"></div>
    </div>`;

  // Descrição longa abre fechada, com "Ver mais"
  const descEl = document.getElementById('pd-desc-texto');
  if (descEl && descEl.scrollHeight > descEl.clientHeight + 4) document.getElementById('pd-ver-mais').hidden = false;
  else descEl?.classList.remove('fechada');

  // Carrega avaliações, relacionados e "tbm pode gostar" em paralelo
  ligarCarrossel();
  carregarAvaliacoes(p);
  carregarRelacionados(p);
  carregarTbmPodeGostar(p);

  getFavoritosIds().then(favs => {
    const btn = document.getElementById('btn-fav-detalhe');
    if (btn && favs.has(p.id)) btn.innerHTML = iconeFav(true, 22);
  });
}

window.toggleFavoritoDetalhe = async function(produtoId) {
  const r = await toggleFavorito(produtoId);
  if (r.precisaLogin) { window.location.href = linkLogin(); return; }
  const btn = document.getElementById('btn-fav-detalhe');
  if (btn) btn.innerHTML = iconeFav(r.favoritado, 22);
}

// ——— CORES ———
// Galeria: as fotos ficam lado a lado e o cliente desliza com o dedo
// (scroll-snap). O contador "1/9" e as miniaturas acompanham.
window.irParaFoto = function(i) {
  const c = document.getElementById('pd-carrossel');
  if (c) c.scrollTo({ left: c.clientWidth * i, behavior: 'smooth' });
};
function ligarCarrossel() {
  const c = document.getElementById('pd-carrossel');
  if (!c) return;
  let quadro = null;
  c.addEventListener('scroll', () => {
    if (quadro) return;
    quadro = requestAnimationFrame(() => {
      quadro = null;
      const i = Math.round(c.scrollLeft / Math.max(1, c.clientWidth));
      const total = c.children.length;
      const cont = document.getElementById('pd-contador');
      if (cont) cont.textContent = `${i + 1}/${total}`;
      document.querySelectorAll('#pd-miniaturas button').forEach((b, j) => b.classList.toggle('ativa', j === i));
      document.querySelectorAll('#pd-miniaturas button')[i]?.scrollIntoView({ inline: 'nearest', block: 'nearest' });
    });
  }, { passive: true });
  // No computador: setas do teclado passam as fotos
  c.tabIndex = 0;
  c.addEventListener('keydown', e => {
    const i = Math.round(c.scrollLeft / c.clientWidth);
    if (e.key === 'ArrowRight') irParaFoto(i + 1);
    if (e.key === 'ArrowLeft') irParaFoto(Math.max(0, i - 1));
  });
}

window.selecionarVariacao = function(i) {
  const p = window._produto;
  const v = variacoesDe(p)[i];
  if (!v || !variacaoDisponivel(v)) return;
  _variacaoSelecionada = v;
  mostrarOpcaoEscolhida(v.nome);
  document.querySelectorAll('#variacoes-container button').forEach((b, j) => {
    b.classList.toggle('ativa', j === i);
  });
  const preco = precoVariacao(p, v);
  document.getElementById('detail-price').textContent = formatPrice(preco);
  document.getElementById('detail-installment').textContent = `ou 12x de ${formatPrice(preco / 12)} sem juros`;
  // Preço antigo riscado: o da opção (como na Shopee); sem ele, some
  const antigoEl = document.getElementById('detail-price-old');
  const antigo = Number(v.preco_antigo);
  antigoEl.hidden = !(antigo > preco);
  if (antigo > preco) antigoEl.textContent = formatPrice(antigo);
  const selo = document.getElementById('pd-selo-desconto');
  const pct = antigo > preco ? Math.round((1 - preco / antigo) * 100) : 0;
  if (selo) { selo.hidden = !pct; selo.textContent = `-${pct}%`; }
  const est = (v.estoque === null || v.estoque === undefined || v.estoque === '') ? null : Number(v.estoque);
  document.getElementById('estoque-info').innerHTML = est !== null && est <= 5
    ? `<p style="font-size:13px;color:#f59e0b;font-weight:700;margin-bottom:16px;display:flex;align-items:center;gap:6px">${icone('alerta', 16)} Últimas ${est} unidades dessa opção!</p>`
    : '<div style="margin-bottom:16px"></div>';
  if (est !== null && qty > est) { qty = Math.max(1, est); document.getElementById('qty-display').textContent = qty; }
  atualizarGanhos();
};

// Cashback e indicação acompanham a opção escolhida e a quantidade
function atualizarGanhos() {
  const p = window._produto;
  if (!p) return;
  const preco = _variacaoSelecionada ? precoVariacao(p, _variacaoSelecionada) : p.price;
  const total = preco * qty;
  const cb = document.getElementById('valor-cashback');
  const ind = document.getElementById('valor-indicacao');
  if (cb) cb.textContent = formatPrice(total * (p.cashback_percentual || 0) / 100);
  if (ind) ind.textContent = formatPrice(total * (p.indicacao_percentual || 0) / 100);
}

// ——— AVALIAÇÕES ———
// Fotos/vídeos vão pro bucket 'avaliacoes' e toda avaliação passa pela
// aprovação do admin antes de aparecer (_interno/sql-avaliacoes-midia-aprovacao.sql).
// Bônus sai na aprovação: R$ 1,00 com 100+ caracteres, 1 foto; senão R$ 0,50.
const AV_MIN_CARACTERES = 100;
const AV_MAX_FOTOS = 5;
const AV_MAX_VIDEO_MB = 50;
let _avFotos = [];      // File[] novos
let _avVideo = null;    // File novo
let _avExistente = null; // avaliação do próprio cliente (pra editar)
let _avPedidoId = null;   // compra que está sendo avaliada

function midiaAvaliacaoHTML(a) {
  const fotos = (a.fotos || []).map(u => `<a href="${esc(u)}" target="_blank" rel="noopener"><img src="${esc(u)}" loading="lazy" alt="Foto da avaliação" style="width:72px;height:72px;object-fit:cover;border-radius:8px;border:1px solid var(--border)"></a>`).join('');
  const videos = (a.videos || []).map(u => `<video src="${esc(u)}" controls preload="metadata" playsinline style="width:160px;max-width:100%;height:120px;border-radius:8px;background:#000;border:1px solid var(--border)"></video>`).join('');
  return fotos || videos ? `<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px">${fotos}${videos}</div>` : '';
}

function formAvaliacaoHTML(p, existente) {
  return `
    <div class="av-card">
      <div class="av-form-topo">
        <span class="av-form-ico">${icone('coracao', 18)}</span>
        <div>
          <p class="av-form-titulo">${existente ? 'Editar sua avaliação' : 'Deixe sua avaliação'}</p>
          <p class="av-form-sub">Ganhe <strong>R$ 0,50</strong> de saldo, ou <strong>R$ 1,00</strong> escrevendo ${AV_MIN_CARACTERES}+ caracteres com 1 foto. O saldo cai quando a avaliação for aprovada.</p>
        </div>
      </div>
      <div class="av-notas" id="estrelas-form">
        ${[1,2,3,4,5].map(n => `<button type="button" onclick="selecionarNota(${n})" id="star-${n}" class="av-nota" aria-label="Nota ${n}">${icone('coracao', 34)}</button>`).join('')}
      </div>
      <label class="av-texto">
        <span class="av-texto-ico">${icone('lapis', 18)}</span>
        <textarea id="av-texto" rows="3" maxlength="1000" placeholder="Conte sua experiência com o produto..." oninput="atualizarBonusAvaliacao()">${esc(existente?.texto || '')}</textarea>
      </label>
      <div class="av-midias">
        <label class="av-midia-btn">${icone('camera', 22)}<span>Fotos (até ${AV_MAX_FOTOS})</span>${icone('chevron', 16)}
          <input type="file" id="av-fotos" accept="image/*" multiple hidden onchange="adicionarFotosAvaliacao(this)">
        </label>
        <!-- Vídeo: o botão fica, mas o envio está desligado por enquanto (o banco também recusa) -->
        <button type="button" class="av-midia-btn av-midia-off" onclick="showToast('Envio de vídeo em breve! Por enquanto, mande fotos.', 'info')">${icone('video', 22)}<span>Vídeo <small>em breve</small></span>${icone('chevron', 16)}</button>
      </div>
      <div id="av-previews" style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px"></div>
      <div id="av-bonus" class="av-bonus"></div>
      <button class="btn btn-primary btn-full av-enviar" id="btn-enviar-avaliacao" onclick="enviarAvaliacao('${p.id}')">${icone('enviar', 18)} ${existente ? 'Reenviar avaliação' : 'Enviar avaliação'}</button>
    </div>`;
}

async function carregarAvaliacoes(p) {
  const { data: avaliacoes } = await supabase
    .from('avaliacoes')
    .select('*')
    .eq('produto_id', p.id)
    .order('created_at', { ascending: false });

  const { data: { session: _sessAval } } = await supabase.auth.getSession();
  const user = _sessAval?.user || null;
  // Uma avaliação por compra: cada pedido entregue com este produto pode
  // ser avaliado uma vez (_interno/sql-avaliacao-por-compra.sql)
  const minhas = (avaliacoes || []).filter(a => user && a.usuario_id === user.id);
  const aprovadas = (avaliacoes || []).filter(a => a.status === 'aprovada');

  let comprasSemAvaliacao = [];
  if (user) {
    const { data: entregues } = await supabase
      .from('pedidos')
      .select('id, created_at')
      .eq('usuario_id', user.id)
      .eq('status', 'entregue')
      .contains('itens', JSON.stringify([{ produto_id: Number(p.id) }]))
      .order('created_at', { ascending: true });
    const avaliados = new Set(minhas.map(a => a.pedido_id));
    comprasSemAvaliacao = (entregues || []).filter(e => !avaliados.has(e.id));
  }

  const totalAv = aprovadas.length;
  const mediaAv = totalAv ? (aprovadas.reduce((s, a) => s + a.nota, 0) / totalAv).toFixed(1) : '-';

  _avFotos = []; _avVideo = null;
  const reprovada = minhas.find(a => a.status === 'reprovada') || null;
  const aguardando = minhas.filter(a => a.status === 'pendente').length;
  _avExistente = reprovada;
  // Veio do botão "Avaliar" de um pedido em Meus Pedidos: avalia aquela compra
  const pedidoDaUrl = new URLSearchParams(location.search).get('pedido');
  const escolhida = comprasSemAvaliacao.find(e => e.id === pedidoDaUrl) || comprasSemAvaliacao[0];
  _avPedidoId = reprovada ? reprovada.pedido_id : (escolhida?.id || null);

  const caixa = (cor, borda, html) => `<div style="background:${cor};border:1px solid ${borda};border-radius:10px;padding:12px 16px;margin-bottom:12px;font-size:13px">${html}</div>`;
  const avisoAguardando = aguardando
    ? caixa('rgba(245,158,11,0.08)', 'rgba(245,158,11,0.4)', `${aguardando === 1 ? 'Sua avaliação foi enviada e está' : `Você tem ${aguardando} avaliações`} aguardando aprovação. O saldo cai assim que for aprovada.`)
    : '';
  const dataCompra = (pid) => {
    const c = comprasSemAvaliacao.find(e => e.id === pid);
    return c ? new Date(c.created_at).toLocaleDateString('pt-BR') : '';
  };

  let formAvaliar;
  if (!user) {
    formAvaliar = `<div style="background:var(--bg-muted);border-radius:10px;padding:12px 16px;margin-bottom:16px;font-size:13px;color:var(--text-muted)"><a href="${linkLogin()}" style="color:var(--primary);font-weight:700">Faça login</a> para avaliar este produto.</div>`;
  } else if (reprovada) {
    formAvaliar = avisoAguardando + caixa('rgba(239,68,68,0.08)', 'rgba(239,68,68,0.4)', `Sua avaliação não foi aprovada${reprovada.motivo_reprovacao ? `: ${esc(reprovada.motivo_reprovacao)}` : '.'} Você pode ajustar e reenviar.`) + formAvaliacaoHTML(p, reprovada);
  } else if (comprasSemAvaliacao.length) {
    const extra = minhas.length || comprasSemAvaliacao.length > 1
      ? `<p style="font-size:12px;color:var(--text-muted);margin:0 0 8px">Avaliando a compra de ${dataCompra(_avPedidoId)}${comprasSemAvaliacao.length > 1 ? ` (mais ${comprasSemAvaliacao.length - 1} pra avaliar depois)` : ''}.</p>`
      : '';
    formAvaliar = avisoAguardando + extra + formAvaliacaoHTML(p, null);
  } else if (aguardando) {
    formAvaliar = avisoAguardando;
  } else if (minhas.length) {
    formAvaliar = caixa('rgba(170,239,0,0.06)', 'rgba(170,239,0,0.25)', 'Você já avaliou suas compras deste produto. Comprou de novo? Depois da entrega dá pra avaliar outra vez.');
  } else {
    formAvaliar = `<div style="background:var(--bg-muted);border-radius:10px;padding:12px 16px;margin-bottom:16px;font-size:13px;color:var(--text-muted)">Você poderá avaliar este produto depois de recebê-lo.</div>`;
  }

  const listaHTML = totalAv ? aprovadas.map(a => `
    <div style="border-bottom:1px solid var(--border);padding:16px 0">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
        <div style="display:flex;align-items:center;gap:8px">
          <span style="font-weight:700;font-size:13px">${esc(a.autor_nome || 'Cliente')}</span>
          <span class="av-estrelas av-estrelas-p">${[1,2,3,4,5].map(n => `<span class="av-estrela${n <= a.nota ? ' cheia' : ''}">${icone('coracao', 14)}</span>`).join('')}</span>
        </div>
        <span style="font-size:11px;color:var(--text-muted)">${new Date(a.created_at).toLocaleDateString('pt-BR')}</span>
      </div>
      ${a.texto ? `<p style="font-size:13px;color:var(--text-muted);line-height:1.6">${esc(a.texto)}</p>` : ''}
      ${midiaAvaliacaoHTML(a)}
    </div>`).join('')
    : `<div class="av-vazio"><span class="av-vazio-ico">${icone('balao', 40)}</span><p>Nenhuma avaliação ainda.</p><strong>Seja o primeiro!</strong></div>`;

  const estrelasMedia = [1,2,3,4,5].map(n => `<span class="av-estrela${mediaAv !== '-' && n <= Math.round(Number(mediaAv)) ? ' cheia' : ''}">${icone('coracao', 24)}</span>`).join('');
  document.getElementById('avaliacoes-content').innerHTML = `
    <div class="av-card av-resumo">
      ${totalAv ? `<p class="av-media">${mediaAv}</p>` : ''}
      <div><div class="av-estrelas">${estrelasMedia}</div>
      <p class="av-total">${totalAv} ${totalAv === 1 ? 'avaliação' : 'avaliações'}</p></div>
    </div>
    ${formAvaliar}
    <div class="av-lista">${listaHTML}</div>`;

  if (_avExistente) selecionarNota(_avExistente.nota);
  if (document.getElementById('av-previews')) { renderPreviewsAvaliacao(); atualizarBonusAvaliacao(); }
}

let _notaSelecionada = 0;
window.selecionarNota = function(n) {
  _notaSelecionada = n;
  [1,2,3,4,5].forEach(i => {
    const el = document.getElementById('star-' + i);
    if (el) el.classList.toggle('cheia', i <= n);
  });
};

// Fotos/vídeo que valem pro bônus: os novos escolhidos agora ou, na
// reedição, os que já estavam na avaliação
function contagemMidiasAvaliacao() {
  return {
    fotos: _avFotos.length || (_avExistente?.fotos || []).length,
    videos: _avVideo ? 1 : (_avExistente?.videos || []).length
  };
}

window.atualizarBonusAvaliacao = function() {
  const el = document.getElementById('av-bonus');
  if (!el) return;
  const chars = (document.getElementById('av-texto')?.value || '').trim().length;
  const { fotos } = contagemMidiasAvaliacao();
  const item = (ok, ico, texto) => `<span class="av-req${ok ? ' ok' : ''}">${icone(ok ? 'checkCirculo' : ico, 16)} ${texto}</span>`;
  // Vídeo saiu da avaliação: R$ 1,00 = texto caprichado + 1 foto
  const completo = chars >= AV_MIN_CARACTERES && fotos >= 1;
  el.innerHTML = `<div class="av-reqs">${item(chars >= AV_MIN_CARACTERES, 'arquivo', `${Math.min(chars, AV_MIN_CARACTERES)}/${AV_MIN_CARACTERES} caracteres`)}<span class="av-req-sep"></span>${item(fotos >= 1, 'imagem', '1 foto')}</div>
    <p class="av-bonus-linha"><span style="color:var(--primary);display:inline-flex">${icone('moedas', 18)}</span> Bônus ao aprovar: <strong>${completo ? 'R$ 1,00' : 'R$ 0,50'}</strong></p>`;
};

function renderPreviewsAvaliacao() {
  const box = document.getElementById('av-previews');
  if (!box) return;
  const antigas = _avFotos.length ? [] : (_avExistente?.fotos || []).map(u => ({ url: u, tipo: 'foto' }));
  const antigoVideo = _avVideo ? [] : (_avExistente?.videos || []).map(u => ({ url: u, tipo: 'video' }));
  const novas = _avFotos.map((f, i) => ({ url: URL.createObjectURL(f), tipo: 'foto', i }));
  const novoVideo = _avVideo ? [{ url: URL.createObjectURL(_avVideo), tipo: 'video', novo: true }] : [];
  box.innerHTML = [...antigas, ...novas, ...antigoVideo, ...novoVideo].map(m => `
    <div style="position:relative">
      ${m.tipo === 'foto'
        ? `<img src="${esc(m.url)}" style="width:64px;height:64px;object-fit:cover;border-radius:8px;border:1px solid var(--border)">`
        : `<video src="${esc(m.url)}" muted playsinline preload="metadata" style="width:96px;height:64px;object-fit:cover;border-radius:8px;background:#000;border:1px solid var(--border)"></video>`}
      ${m.i !== undefined ? `<button type="button" onclick="removerFotoAvaliacao(${m.i})" style="position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;border:none;background:#ef4444;color:#fff;font-size:12px;cursor:pointer;line-height:1">×</button>` : ''}
      ${m.novo ? `<button type="button" onclick="removerVideoAvaliacao()" style="position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;border:none;background:#ef4444;color:#fff;font-size:12px;cursor:pointer;line-height:1">×</button>` : ''}
    </div>`).join('');
}

window.adicionarFotosAvaliacao = function(input) {
  const novas = [...input.files].filter(f => f.type.startsWith('image/'));
  input.value = '';
  if (_avFotos.length + novas.length > AV_MAX_FOTOS) showToast(`Máximo de ${AV_MAX_FOTOS} fotos`, 'error');
  _avFotos = [..._avFotos, ...novas].slice(0, AV_MAX_FOTOS);
  renderPreviewsAvaliacao(); atualizarBonusAvaliacao();
};
window.removerFotoAvaliacao = function(i) {
  _avFotos.splice(i, 1);
  renderPreviewsAvaliacao(); atualizarBonusAvaliacao();
};
window.adicionarVideoAvaliacao = function(input) {
  const f = input.files[0];
  input.value = '';
  if (!f) return;
  if (!f.type.startsWith('video/')) { showToast('Escolha um arquivo de vídeo', 'error'); return; }
  if (f.size > AV_MAX_VIDEO_MB * 1024 * 1024) { showToast(`Vídeo muito grande (máx. ${AV_MAX_VIDEO_MB} MB). Grave um vídeo mais curto.`, 'error'); return; }
  _avVideo = f;
  renderPreviewsAvaliacao(); atualizarBonusAvaliacao();
};
window.removerVideoAvaliacao = function() {
  _avVideo = null;
  renderPreviewsAvaliacao(); atualizarBonusAvaliacao();
};

async function enviarArquivoAvaliacao(userId, file, extPadrao) {
  const ext = (file.name.split('.').pop() || extPadrao).toLowerCase().replace(/[^a-z0-9]/g, '') || extPadrao;
  const caminho = `${userId}/${Date.now()}-${Math.random().toString(36).slice(2, 8)}.${ext}`;
  const { error } = await supabase.storage.from('avaliacoes').upload(caminho, file, { contentType: file.type, upsert: false });
  if (error) throw error;
  return supabase.storage.from('avaliacoes').getPublicUrl(caminho).data.publicUrl;
}

window.enviarAvaliacao = async function(produtoId) {
  if (!_notaSelecionada) { showToast('Selecione uma nota de 1 a 5', 'error'); return; }
  const texto = document.getElementById('av-texto').value.trim();
  const { data: { session: _sessEnviar } } = await supabase.auth.getSession();
  const user = _sessEnviar?.user || null;
  if (!user) { showToast('Faça login para avaliar', 'error'); return; }

  const btn = document.getElementById('btn-enviar-avaliacao');
  const textoBtn = btn.textContent;
  btn.disabled = true; btn.textContent = 'Enviando...';

  try {
    let fotos = _avExistente?.fotos || [];
    let videos = _avExistente?.videos || [];
    if (_avFotos.length) {
      btn.textContent = 'Enviando fotos...';
      fotos = [];
      for (const f of _avFotos) {
        const otim = typeof otimizarImagem === 'function' ? await otimizarImagem(f, { lado: 1280, qualidade: 0.8 }) : f;
        fotos.push(await enviarArquivoAvaliacao(user.id, otim, 'jpg'));
      }
    }
    if (_avVideo) {
      btn.textContent = 'Enviando vídeo...';
      videos = [await enviarArquivoAvaliacao(user.id, _avVideo, 'mp4')];
    }

    const dados = { nota: _notaSelecionada, texto, fotos, videos };
    const { error } = _avExistente
      ? await supabase.from('avaliacoes').update(dados).eq('id', _avExistente.id)
      : await supabase.from('avaliacoes').insert({ ...dados, produto_id: produtoId, usuario_id: user.id, pedido_id: _avPedidoId });
    if (error) throw error;

    showToast('Avaliação enviada! Ela aparece depois de aprovada.', 'success');
    carregarAvaliacoes(window._produto);
  } catch (e) {
    console.error(e);
    btn.disabled = false; btn.textContent = textoBtn;
    showToast('Erro ao enviar avaliação. Tente de novo.', 'error');
  }
};

// ——— HELPER: card mini estilo AliExpress ———
function miniCard(r) {
  const preco = formatPrice(parseFloat(r.price));
  const rating = (Number(r.rating) || 5).toFixed(1);
  const vendidos = Number(r.reviews) || 0;
  const vendidosStr = vendidos >= 1000 ? (vendidos/1000).toFixed(1)+'mil' : vendidos;
  return `
    <a href="produto.html?id=${r.id}" style="text-decoration:none;display:flex;flex-direction:column;background:var(--bg-card);border:1px solid var(--border);border-radius:12px;overflow:hidden;transition:border-color .2s" onmouseover="this.style.borderColor='var(--primary)'" onmouseout="this.style.borderColor='var(--border)'">
      <div style="aspect-ratio:1;background:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative">
        ${percentualDesconto(r) ? `<span class="selo-desconto">-${percentualDesconto(r)}%</span>` : ''}
        ${r.image_url
          ? `<img src="${r.image_thumb_url || r.image_url}" loading="lazy" decoding="async" style="width:100%;height:100%;object-fit:cover;display:block">`
          : `<span style="font-size:52px">${r.emoji ? esc(r.emoji) : icone('caixa', 44)}</span>`}
      </div>
      <div style="padding:8px">
        <div style="font-size:12px;font-weight:600;color:var(--text);line-height:1.3;margin-bottom:5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden">${esc(r.name)}</div>
        ${vendidos ? `<div style="display:flex;align-items:center;gap:5px;margin-bottom:5px">
          <span class="pc-nota" style="font-size:11px"><span class="pc-estrela">${icone('coracao', 12)}</span> ${rating}</span>
          <span style="font-size:11px;color:var(--text-muted)">(${vendidosStr})</span>
        </div>` : ''}
        <div style="font-size:15px;font-weight:900;color:var(--primary)">${preco}</div>
        ${r.old_price ? `<div style="font-size:11px;color:var(--text-muted);text-decoration:line-through">${formatPrice(parseFloat(r.old_price))}</div>` : ''}
      </div>
    </a>`;
}

// ——— PRODUTOS RELACIONADOS (vinculados no admin) ———
async function carregarRelacionados(p) {
  const ids = p.relacionados_ids || [];
  if (!ids.length) return;

  const { data: relacionados } = await supabase
    .from('produtos')
    .select('*')
    .in('id', ids)
    .eq('ativo', true);

  if (!relacionados?.length) return;

  document.getElementById('relacionados-section').style.display = 'block';
  document.getElementById('relacionados-grid').innerHTML = relacionados.map(r => miniCard(r)).join('');
}

// ——— VOCÊ TAMBÉM PODE GOSTAR (mesma categoria, exceto o atual) ———
async function carregarTbmPodeGostar(p) {
  const { data: similares } = await supabase
    .from('produtos')
    .select('*')
    .eq('category', p.category)
    .eq('ativo', true)
    .neq('id', p.id)
    .limit(6);

  if (!similares?.length) return;

  document.getElementById('tbm-section').style.display = 'block';
  document.getElementById('tbm-grid').innerHTML = similares.map(r => miniCard(r)).join('');
}

// Link de indicação DESTE produto: produto.html?id=X&ref=CODIGO.
// O js/main.js guarda o ?ref de qualquer página, e o banco credita a
// comissão quando o pedido é entregue (só se o código existir).
window.compartilharIndicacao = async function(btn) {
  const { data: { session } } = await supabase.auth.getSession();
  if (!session?.user) {
    showToast('Entre na sua conta pra pegar seu link de indicação.', 'info');
    setTimeout(() => { window.location.href = 'login.html?redirect=' + encodeURIComponent(location.pathname.slice(1) + location.search); }, 1200);
    return;
  }
  const { data: u } = await supabase.from('usuarios').select('codigo_indicacao').eq('id', session.user.id).single();
  if (!u?.codigo_indicacao) { showToast('Seu código ainda está sendo gerado. Tente de novo em instantes.', 'error'); return; }

  const url = new URL(location.href);
  url.search = '';
  url.searchParams.set('id', window._produto?.id);
  url.searchParams.set('ref', u.codigo_indicacao);
  const link = url.toString();

  // No celular abre o compartilhar (WhatsApp etc.); no computador, copia
  if (navigator.share) {
    try { await navigator.share({ title: window._produto?.name || 'Zipshop', url: link }); return; }
    catch (e) { if (e.name === 'AbortError') return; }
  }
  try {
    await navigator.clipboard.writeText(link);
    const original = btn.textContent;
    btn.innerHTML = icone('check', 14) + ' Link copiado!';
    setTimeout(() => { btn.textContent = original; }, 2000);
  } catch {
    prompt('Copie seu link:', link);
  }
};

window.changeQty = function(dir) {
  const v = _variacaoSelecionada;
  const estoque = v ? v.estoque : window._produto?.stock;
  const max = (estoque !== null && estoque !== undefined && estoque !== '') ? Number(estoque) : Infinity;
  qty = Math.max(1, Math.min(qty + dir, max || 1));
  document.getElementById('qty-display').textContent = qty;
  atualizarGanhos();
};

// Devolve true se colocou no carrinho (o "Comprar Agora" só segue pro carrinho nesse caso)
window.doAddToCart = function(event) {
  const p = window._produto;
  if (!p) return false;
  const temVariacoes = !!document.getElementById('variacoes-container');
  // Produto com opções (variação/kit ou cor): o cliente precisa escolher,
  // senão a loja não sabe o que mandar
  if ((temVariacoes && !_variacaoSelecionada) || (!temVariacoes && !_corSelecionada && document.getElementById('cores-container'))) {
    avisarEscolherCor();
    return false;
  }
  let dados = p;
  if (_variacaoSelecionada) {
    const v = _variacaoSelecionada;
    dados = { ...p, price: precoVariacao(p, v), name: p.name + ' — ' + v.nome, variacao_id: v.id };
  } else if (_corSelecionada) {
    dados = { ...p, name: p.name + ' — ' + _corSelecionada, cor: _corSelecionada };
  }
  addToCart(dados.id, qty, dados, event);
  return true;
};

window.showTab = function(tab) {
  ['desc','specs','avaliacoes'].forEach(t => {
    document.getElementById('pane-' + t).style.display = t === tab ? 'block' : 'none';
    document.getElementById('tab-' + t).style.borderBottomColor = t === tab ? 'var(--primary)' : 'transparent';
    document.getElementById('tab-' + t).style.color = t === tab ? 'var(--primary)' : 'var(--text-muted)';
  });
  if (tab === 'avaliacoes') carregarAvaliacoes(window._produto);
};

render().catch(err => {
  console.error('Erro ao abrir o produto:', err);
  document.getElementById('content').innerHTML = `<div style="text-align:center;padding:80px 16px"><h2 style="margin:0 0 8px">Não deu pra carregar o produto</h2><p style="color:var(--text-muted);margin-bottom:16px">Confira sua internet e tente de novo.</p><button class="btn btn-primary" onclick="location.reload()">Tentar de novo</button></div>`;
}).then(() => {
  if (location.hash === '#avaliar' && window._produto) {
    showTab('avaliacoes');
    document.getElementById('tab-avaliacoes')?.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
});
</script>
