<!DOCTYPE html>
<html lang="pt-BR">
<head>
<link rel="preconnect" href="https://kkliwdphrdbguclsvxcw.supabase.co">
<link rel="dns-prefetch" href="https://kkliwdphrdbguclsvxcw.supabase.co">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="base" content="">
  <title>Produto — Zipshop</title>
  <meta name="description" content="Confira esse produto na Zipshop, a loja de eletrônicos mais rápida do Brasil.">
  <meta property="og:type" content="product">
  <meta property="og:site_name" content="Zipshop">
  <meta property="og:image" content="https://zipshop01.netlify.app/img/logo-icon.jpeg">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="navbar"></div>
<div id="content"></div>
<div id="footer"></div>

<script src="js/cart.js"></script>
<script src="js/imagem.js"></script>
<script src="js/main.js"></script>
<script type="module">
function esc(str) {
  if (str === null || str === undefined) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');
}

import { supabase } from './js/supabase-config.js';
import { getProduct, formatPrice, starsHTML, variacoesDe, precoVariacao, variacaoDisponivel } from './js/data.js';
import { getFavoritosIds, toggleFavorito } from './js/favoritos.js';
import { registrarEvento } from './js/analytics.js';

const id = new URLSearchParams(location.search).get('id');
let qty = 1;
let _corSelecionada = null;
let _variacaoSelecionada = null;

async function render() {
  const p = await getProduct(id);
  window._produto = p;
  registrarEvento('visualizacao_produto', { produtoId: p.id });
  if (!p) {
    document.getElementById('content').innerHTML = `<div style="text-align:center;padding:80px 16px"><p style="font-size:48px">😕</p><h2 style="margin:16px 0 8px">Produto não encontrado</h2><a href="produtos.html" class="btn btn-primary">Ver Produtos</a></div>`;
    return;
  }
  document.title = p.name + ' — Zipshop';
  // specs pode vir como lista [{nome, valor}] (novo, mantém a ordem) ou objeto (antigo)
  const listaSpecs = Array.isArray(p.specs) ? p.specs
    : Object.entries(p.specs || {}).map(([nome, valor]) => ({ nome, valor }));
  const specs = listaSpecs.filter(s => s && s.nome)
    .map(s => `<tr><td>${esc(s.nome)}</td><td>${esc(s.valor)}</td></tr>`).join('');

  // Cores (se o produto tiver variações)
  const cores = (p.cores || []).map(c => ({ ...c, nome: String(c.nome || '').replace(/[\s:—–-]+$/, '') })).filter(c => c.nome);

  // Galeria: imagem de capa (image_url) + fotos extras (imagens).
  // Sempre mostra pelo menos a capa como primeira miniatura.
  // Produtos antigos guardavam as fotos extras como texto (só a URL), e
  // não como {url, thumb} — por isso apareciam miniaturas quebradas "?".
  // Aqui aceita os dois formatos, ignora itens vazios e fotos repetidas.
  const galeria = [];
  const urlsVistas = new Set();
  [
    p.image_url ? { url: p.image_url, thumb: p.image_thumb_url } : null,
    ...(Array.isArray(p.imagens) ? p.imagens : [])
  ].forEach(item => {
    const url = typeof item === 'string' ? item : item?.url;
    if (!url || typeof url !== 'string' || urlsVistas.has(url)) return;
    urlsVistas.add(url);
    galeria.push({ url, thumb: (typeof item === 'object' && item.thumb) || url });
  });
  const galeriaHTML = galeria.length > 1 ? `
    <div style="display:flex;gap:8px;margin-top:10px;overflow-x:auto;padding-bottom:4px">
      ${galeria.map((img, i) => `
        <button onclick="trocarFotoGaleria('${(img.url||'').replace(/'/g,"\\'")}', this)"
          style="flex-shrink:0;width:64px;height:64px;border-radius:10px;overflow:hidden;padding:0;cursor:pointer;background:var(--bg-muted);border:2px solid ${i===0 ? 'var(--primary)' : 'var(--border)'}">
          <img src="${img.thumb || img.url}" loading="lazy" alt="" style="width:100%;height:100%;object-fit:cover" onerror="this.closest('button').remove()">
        </button>`).join('')}
    </div>` : '';

  // Variações/kits com preço e estoque próprios: substituem as cores
  const variacoes = variacoesDe(p);
  const temControleEstoque = !variacoes.length && p.stock !== null && p.stock !== undefined;
  const semEstoque = variacoes.length ? !variacoes.some(variacaoDisponivel) : (temControleEstoque && p.stock <= 0);
  let estoqueHTML = '';
  if (semEstoque) {
    estoqueHTML = `<p style="font-size:13px;color:#ef4444;font-weight:700;margin-bottom:16px">❌ Fora de estoque no momento</p>`;
  } else if (temControleEstoque && p.stock <= 5) {
    estoqueHTML = `<p style="font-size:13px;color:#f59e0b;font-weight:700;margin-bottom:16px">⚠️ Últimas ${p.stock} unidades!</p>`;
  } else {
    estoqueHTML = `<div style="margin-bottom:16px"></div>`;
  }

  const variacoesHTML = variacoes.length ? `
    <div style="margin-bottom:20px">
      <div class="detail-label" style="margin-bottom:8px">Opção</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap" id="variacoes-container">
        ${variacoes.map((v, i) => {
          const disp = variacaoDisponivel(v);
          return `<button type="button" onclick="selecionarVariacao(${i})" id="var-${i}" ${disp ? '' : 'disabled'}
            style="display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:8px 14px;border:2px solid var(--border);border-radius:12px;background:none;cursor:${disp ? 'pointer' : 'not-allowed'};font-size:13px;color:var(--text);transition:border-color .2s;${disp ? '' : 'opacity:.45;text-decoration:line-through'}">
            <span style="font-weight:700">${esc(v.nome)}</span>
            <span style="font-size:12px;color:var(--text-muted)">${formatPrice(precoVariacao(p, v))}${disp ? '' : ' · esgotado'}</span>
          </button>`;
        }).join('')}
      </div>
    </div>` : '';

  const coresHTML = !variacoes.length && cores.length ? `
    <div style="margin-bottom:20px">
      <div class="detail-label" style="margin-bottom:8px">Cor</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap" id="cores-container">
        ${cores.map((c, i) => `
          <button onclick="selecionarCor('${esc(c.nome)}', this)"
            style="display:flex;align-items:center;gap:6px;padding:6px 14px;border:2px solid var(--border);border-radius:20px;background:none;cursor:pointer;font-size:13px;color:var(--text);transition:border-color .2s"
            id="cor-${i}">
            ${c.hex ? `<span style="width:14px;height:14px;border-radius:50%;background:${c.hex};border:1px solid rgba(255,255,255,.2);flex-shrink:0"></span>` : ''}
            ${esc(c.nome)}
          </button>`).join('')}
      </div>
    </div>` : '';

  document.getElementById('content').innerHTML = `
    <div class="page-hero" style="padding:16px">
      <div class="container">
        <div class="breadcrumb">
          <a href="index.html">Home</a><span>/</span>
          <a href="produtos.html">Produtos</a><span>/</span>
          <a href="produtos.html?cat=${encodeURIComponent(p.category)}">${p.category}</a><span>/</span>
          <span>${p.name}</span>
        </div>
      </div>
    </div>

    <div class="detail-layout">
      <div>
        <div class="detail-img" id="detail-img-wrap" style="background:${p.image_url ? '#fff' : 'linear-gradient(135deg,#1e3a6e,#2563eb)'};${p.image_url ? 'cursor:zoom-in' : ''}" ${p.image_url ? `onclick="abrirImagemCheia(document.getElementById('detail-main-img').src)"` : ''}>
          ${p.image_url ? `<img id="detail-main-img" src="${p.image_url}" alt="${esc(p.name)}" style="width:100%;height:100%;object-fit:contain;border-radius:12px">` : `<span style="font-size:140px">${p.emoji}</span>`}
        </div>
        ${galeriaHTML}
      </div>
      <div>
        <div style="font-size:12px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px">${p.brand}</div>
        <h1 class="detail-title">${p.name}</h1>
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:16px">
          <span class="stars">${starsHTML(p.rating)}</span>
          <span class="stars-count">(${p.reviews} avaliações)</span>
          ${p.discount ? `<span class="badge badge-red">-${p.discount}%</span>` : ''}
        </div>
        ${p.oldPrice ? `<div class="detail-price-old">${formatPrice(p.oldPrice)}</div>` : ''}
        <div class="detail-price" id="detail-price">${variacoes.length ? '<span style="font-size:14px;font-weight:600;color:var(--text-muted)">a partir de </span>' : ''}${formatPrice(p.price)}</div>
        <div class="detail-installment" id="detail-installment">ou 12x de ${formatPrice(p.price/12)} sem juros</div>
        ${p.cashback_percentual > 0 ? `<div style="display:inline-flex;align-items:center;gap:6px;background:rgba(170,239,0,0.12);border:1px solid var(--primary);color:var(--primary);font-size:12px;font-weight:700;padding:5px 10px;border-radius:20px;margin-top:8px">💰 Receba ${formatPrice(p.price * p.cashback_percentual / 100)} de volta em saldo</div>` : ''}
        ${p.indicacao_percentual > 0 ? `<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:8px">
          <span style="display:inline-flex;align-items:center;gap:6px;background:rgba(170,239,0,0.12);border:1px solid var(--primary);color:var(--primary);font-size:12px;font-weight:700;padding:5px 10px;border-radius:20px">🤝 Indique e ganhe ${formatPrice(p.price * p.indicacao_percentual / 100)} por venda</span>
          <button type="button" onclick="compartilharIndicacao(this)" style="background:none;border:none;color:var(--text-muted);font-size:12px;font-weight:700;text-decoration:underline;cursor:pointer;padding:4px 0">Copiar meu link</button>
        </div>` : ''}
        <hr class="detail-divider">
        <div style="background:rgba(170,239,0,.07);border:1px solid rgba(170,239,0,.2);border-radius:12px;padding:12px 16px;margin-bottom:20px;font-size:13px;display:flex;align-items:center;gap:8px">
          ⚡ <strong>Entrega amanhã</strong> — Peça em até 3h para garantir.
        </div>

        ${variacoesHTML}
        ${coresHTML}

        <div class="detail-label">Quantidade</div>
        <div class="qty-control" style="margin-bottom:8px">
          <button class="qty-btn" onclick="changeQty(-1)">−</button>
          <span class="qty-num" id="qty-display">1</span>
          <button class="qty-btn" onclick="changeQty(1)">+</button>
        </div>
        <div id="estoque-info">${estoqueHTML}</div>
        <div style="display:flex;gap:12px;margin-bottom:24px;flex-wrap:wrap">
          <button class="btn btn-primary btn-lg" style="flex:1" onclick="doAddToCart(event)" ${semEstoque ? 'disabled style="opacity:.5;cursor:not-allowed"' : ''}>🛒 Adicionar ao Carrinho</button>
          <a href="carrinho.html" class="btn btn-outline btn-lg" onclick="${semEstoque ? 'event.preventDefault()' : 'if (!doAddToCart(event)) event.preventDefault()'}" ${semEstoque ? 'style="opacity:.5;cursor:not-allowed;pointer-events:none"' : ''}>⚡ Comprar Agora</a>
          <button id="btn-fav-detalhe" onclick="toggleFavoritoDetalhe(${p.id})" class="btn btn-outline btn-lg" style="width:52px;flex:0" aria-label="Favoritar">🤍</button>
        </div>
        <div style="display:flex;gap:16px;flex-wrap:wrap">
          <span style="font-size:13px;color:var(--text-muted)">🔒 Compra 100% segura</span>
          <span style="font-size:13px;color:var(--text-muted)">🔄 30 dias para troca</span>
          ${p.garantia ? `<span style="font-size:13px;color:var(--text-muted)">🛡️ Garantia ${esc(p.garantia)}</span>` : ''}
        </div>
      </div>
    </div>

    <!-- TABS -->
    <div style="max-width:1200px;margin:0 auto;padding:0 16px 32px">
      <div style="display:flex;border-bottom:1px solid var(--border);margin-bottom:24px;gap:0">
        <button onclick="showTab('desc')" id="tab-desc" style="padding:12px 20px;background:none;border:none;border-bottom:2px solid var(--primary);color:var(--primary);font-weight:700;cursor:pointer;font-size:14px">Descrição</button>
        <button onclick="showTab('specs')" id="tab-specs" style="padding:12px 20px;background:none;border:none;border-bottom:2px solid transparent;color:var(--text-muted);cursor:pointer;font-size:14px">Especificações</button>
        <button onclick="showTab('avaliacoes')" id="tab-avaliacoes" style="padding:12px 20px;background:none;border:none;border-bottom:2px solid transparent;color:var(--text-muted);cursor:pointer;font-size:14px">Avaliações</button>
      </div>
      <div id="pane-desc">
        <div style="background:var(--bg-card);border:1px solid var(--primary);border-radius:var(--radius-lg);padding:24px">
          <p style="color:var(--text-muted);line-height:1.8">${p.desc}</p>
        </div>
      </div>
      <div id="pane-specs" style="display:none">
        <div style="background:var(--bg-card);border:1px solid var(--primary);border-radius:var(--radius-lg);padding:24px">
          ${specs ? `<table class="spec-table">${specs}</table>` : '<p style="color:var(--text-muted);font-size:13px">Este produto ainda não tem especificações cadastradas.</p>'}
        </div>
      </div>
      <div id="pane-avaliacoes" style="display:none">
        <div id="avaliacoes-content">
          <div style="padding:40px;text-align:center;color:var(--text-muted)">Carregando avaliações...</div>
        </div>
      </div>
    </div>

    <!-- PRODUTOS RELACIONADOS (vinculados no admin) -->
    <div id="relacionados-section" style="max-width:1200px;margin:0 auto;padding:0 16px 32px;display:none">
      <h2 style="font-size:18px;font-weight:900;margin-bottom:16px">🔗 Produtos Relacionados</h2>
      <div id="relacionados-grid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px"></div>
    </div>

    <!-- VOCÊ TAMBÉM PODE GOSTAR (mesma categoria) -->
    <div id="tbm-section" style="max-width:1200px;margin:0 auto;padding:0 16px 64px;display:none">
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:16px">
        <div style="flex:1;height:1px;background:var(--border)"></div>
        <h2 style="font-size:16px;font-weight:900;white-space:nowrap">Você Também Pode Gostar</h2>
        <div style="flex:1;height:1px;background:var(--border)"></div>
      </div>
      <div id="tbm-grid" style="display:grid;grid-template-columns:repeat(2,1fr);gap:10px"></div>
    </div>`;

  // Carrega avaliações, relacionados e "tbm pode gostar" em paralelo
  carregarAvaliacoes(p);
  carregarRelacionados(p);
  carregarTbmPodeGostar(p);

  getFavoritosIds().then(favs => {
    const btn = document.getElementById('btn-fav-detalhe');
    if (btn && favs.has(p.id)) btn.textContent = '💚';
  });
}

window.toggleFavoritoDetalhe = async function(produtoId) {
  const r = await toggleFavorito(produtoId);
  if (r.precisaLogin) { window.location.href = 'login.html'; return; }
  const btn = document.getElementById('btn-fav-detalhe');
  if (btn) btn.textContent = r.favoritado ? '💚' : '🤍';
}

// ——— CORES ———
window.trocarFotoGaleria = function(url, btn) {
  document.getElementById('detail-main-img').src = url;
  btn.parentElement.querySelectorAll('button').forEach(b => b.style.borderColor = 'var(--border)');
  btn.style.borderColor = 'var(--primary)';
};

// Lightbox: abre a foto do produto em tela cheia ao clicar nela
window.abrirImagemCheia = function(url) {
  const overlay = document.createElement('div');
  overlay.id = 'lightbox-overlay';
  overlay.style = 'position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:300;display:flex;align-items:center;justify-content:center;padding:16px;cursor:zoom-out';
  overlay.onclick = fecharImagemCheia;
  overlay.innerHTML = `
    <button onclick="fecharImagemCheia()" style="position:absolute;top:16px;right:16px;background:rgba(255,255,255,.1);border:none;color:#fff;width:38px;height:38px;border-radius:50%;font-size:20px;cursor:pointer;z-index:1">✕</button>
    <img src="${url}" style="max-width:100%;max-height:100%;object-fit:contain;border-radius:8px" onclick="event.stopPropagation()">`;
  document.body.appendChild(overlay);
  document.body.style.overflow = 'hidden';
};
window.fecharImagemCheia = function() {
  const overlay = document.getElementById('lightbox-overlay');
  if (overlay) overlay.remove();
  document.body.style.overflow = '';
};

window.selecionarVariacao = function(i) {
  const p = window._produto;
  const v = variacoesDe(p)[i];
  if (!v || !variacaoDisponivel(v)) return;
  _variacaoSelecionada = v;
  document.querySelectorAll('#variacoes-container button').forEach((b, j) => {
    b.style.borderColor = j === i ? 'var(--primary)' : 'var(--border)';
  });
  const preco = precoVariacao(p, v);
  document.getElementById('detail-price').textContent = formatPrice(preco);
  document.getElementById('detail-installment').textContent = `ou 12x de ${formatPrice(preco / 12)} sem juros`;
  const est = (v.estoque === null || v.estoque === undefined || v.estoque === '') ? null : Number(v.estoque);
  document.getElementById('estoque-info').innerHTML = est !== null && est <= 5
    ? `<p style="font-size:13px;color:#f59e0b;font-weight:700;margin-bottom:16px">⚠️ Últimas ${est} unidades dessa opção!</p>`
    : '<div style="margin-bottom:16px"></div>';
  if (est !== null && qty > est) { qty = Math.max(1, est); document.getElementById('qty-display').textContent = qty; }
};

window.selecionarCor = function(nome, btn) {
  _corSelecionada = nome;
  document.querySelectorAll('#cores-container button').forEach(b => {
    b.style.borderColor = 'var(--border)';
    b.style.color = 'var(--text)';
  });
  btn.style.borderColor = 'var(--primary)';
  btn.style.color = 'var(--primary)';
};

function avisarEscolherCor() {
  const box = document.getElementById('variacoes-container') || document.getElementById('cores-container');
  if (!box) return;
  showToast(box.id === 'variacoes-container' ? 'Escolha uma opção antes de adicionar ao carrinho' : 'Escolha a cor antes de adicionar ao carrinho', 'error');
  box.scrollIntoView({ behavior: 'smooth', block: 'center' });
  box.querySelectorAll('button:not([disabled])').forEach(b => { b.style.borderColor = '#ef4444'; });
}

// ——— AVALIAÇÕES ———
// Fotos/vídeos vão pro bucket 'avaliacoes' e toda avaliação passa pela
// aprovação do admin antes de aparecer (_interno/sql-avaliacoes-midia-aprovacao.sql).
// Bônus sai na aprovação: R$ 1,00 com 100+ caracteres, 1 foto e 1 vídeo; senão R$ 0,50.
const AV_MIN_CARACTERES = 100;
const AV_MAX_FOTOS = 5;
const AV_MAX_VIDEO_MB = 50;
let _avFotos = [];      // File[] novos
let _avVideo = null;    // File novo
let _avExistente = null; // avaliação do próprio cliente (pra editar)

function midiaAvaliacaoHTML(a) {
  const fotos = (a.fotos || []).map(u => `<a href="${esc(u)}" target="_blank" rel="noopener"><img src="${esc(u)}" loading="lazy" alt="Foto da avaliação" style="width:72px;height:72px;object-fit:cover;border-radius:8px;border:1px solid var(--border)"></a>`).join('');
  const videos = (a.videos || []).map(u => `<video src="${esc(u)}" controls preload="metadata" playsinline style="width:160px;max-width:100%;height:120px;border-radius:8px;background:#000;border:1px solid var(--border)"></video>`).join('');
  return fotos || videos ? `<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px">${fotos}${videos}</div>` : '';
}

function formAvaliacaoHTML(p, existente) {
  return `
    <div style="background:var(--bg-card);border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:20px">
      <p style="font-weight:700;margin-bottom:4px">⭐ ${existente ? 'Editar sua avaliação' : 'Deixe sua avaliação'}</p>
      <p style="font-size:12px;color:var(--text-muted);margin-bottom:12px">Ganhe <strong style="color:var(--primary)">R$ 0,50</strong> de saldo, ou <strong style="color:var(--primary)">R$ 1,00</strong> escrevendo ${AV_MIN_CARACTERES}+ caracteres com 1 foto e 1 vídeo. O saldo cai quando a avaliação for aprovada.</p>
      <div style="display:flex;gap:8px;margin-bottom:12px" id="estrelas-form">
        ${[1,2,3,4,5].map(n => `<button onclick="selecionarNota(${n})" id="star-${n}"
          style="font-size:28px;background:none;border:none;cursor:pointer;opacity:.4;transition:opacity .15s">💚</button>`).join('')}
      </div>
      <textarea id="av-texto" class="form-input" rows="4" maxlength="1000" placeholder="Conte sua experiência com o produto..." style="resize:vertical;margin-bottom:4px" oninput="atualizarBonusAvaliacao()">${esc(existente?.texto || '')}</textarea>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin:8px 0">
        <label class="btn btn-outline btn-sm" style="cursor:pointer">📷 Fotos (até ${AV_MAX_FOTOS})
          <input type="file" id="av-fotos" accept="image/*" multiple hidden onchange="adicionarFotosAvaliacao(this)">
        </label>
        <label class="btn btn-outline btn-sm" style="cursor:pointer">🎥 Vídeo (até ${AV_MAX_VIDEO_MB} MB)
          <input type="file" id="av-video" accept="video/*" hidden onchange="adicionarVideoAvaliacao(this)">
        </label>
      </div>
      <div id="av-previews" style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px"></div>
      <div id="av-bonus" style="font-size:12px;color:var(--text-muted);margin-bottom:12px"></div>
      <button class="btn btn-primary" id="btn-enviar-avaliacao" onclick="enviarAvaliacao('${p.id}')">${existente ? 'Reenviar Avaliação' : 'Enviar Avaliação'}</button>
    </div>`;
}

async function carregarAvaliacoes(p) {
  const { data: avaliacoes } = await supabase
    .from('avaliacoes')
    .select('*, usuarios(nome)')
    .eq('produto_id', p.id)
    .order('created_at', { ascending: false });

  const { data: { session: _sessAval } } = await supabase.auth.getSession();
  const user = _sessAval?.user || null;
  const minha = avaliacoes?.find(a => a.usuario_id === user?.id) || null;
  const aprovadas = (avaliacoes || []).filter(a => a.status === 'aprovada');

  // Só pode avaliar quem já recebeu este produto (o banco também exige isso)
  let recebeuProduto = false;
  if (user && !minha) {
    const { data: entregues } = await supabase
      .from('pedidos')
      .select('id')
      .eq('usuario_id', user.id)
      .eq('status', 'entregue')
      .contains('itens', [{ produto_id: Number(p.id) }])
      .limit(1);
    recebeuProduto = !!(entregues && entregues.length);
  }

  const totalAv = aprovadas.length;
  const mediaAv = totalAv ? (aprovadas.reduce((s, a) => s + a.nota, 0) / totalAv).toFixed(1) : '-';

  _avFotos = []; _avVideo = null;
  _avExistente = minha && minha.status === 'reprovada' ? minha : null;

  let formAvaliar;
  if (!user) {
    formAvaliar = `<div style="background:var(--bg-muted);border-radius:10px;padding:12px 16px;margin-bottom:16px;font-size:13px;color:var(--text-muted)"><a href="login.html" style="color:var(--primary);font-weight:700">Faça login</a> para avaliar este produto.</div>`;
  } else if (!minha) {
    formAvaliar = recebeuProduto
      ? formAvaliacaoHTML(p, null)
      : `<div style="background:var(--bg-muted);border-radius:10px;padding:12px 16px;margin-bottom:16px;font-size:13px;color:var(--text-muted)">Você poderá avaliar este produto depois de recebê-lo. 📦</div>`;
  } else if (minha.status === 'pendente') {
    formAvaliar = `<div style="background:rgba(245,158,11,0.08);border:1px solid rgba(245,158,11,0.4);border-radius:10px;padding:12px 16px;margin-bottom:16px;font-size:13px">⏳ Sua avaliação foi enviada e está aguardando aprovação. O saldo cai assim que ela for aprovada.</div>`;
  } else if (minha.status === 'reprovada') {
    formAvaliar = `<div style="background:rgba(239,68,68,0.08);border:1px solid rgba(239,68,68,0.4);border-radius:10px;padding:12px 16px;margin-bottom:12px;font-size:13px">❌ Sua avaliação não foi aprovada${minha.motivo_reprovacao ? `: ${esc(minha.motivo_reprovacao)}` : '.'} Você pode ajustar e reenviar.</div>` + formAvaliacaoHTML(p, minha);
  } else {
    formAvaliar = `<div style="background:rgba(170,239,0,0.06);border:1px solid rgba(170,239,0,0.25);border-radius:10px;padding:12px 16px;margin-bottom:16px;font-size:13px">✅ Você já avaliou este produto.</div>`;
  }

  const listaHTML = totalAv ? aprovadas.map(a => `
    <div style="border-bottom:1px solid var(--border);padding:16px 0">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
        <div style="display:flex;align-items:center;gap:8px">
          <span style="font-weight:700;font-size:13px">${esc(a.usuarios?.nome || 'Usuário')}</span>
          <span style="color:#facc15;font-size:16px">${'★'.repeat(a.nota)}${'☆'.repeat(5 - a.nota)}</span>
        </div>
        <span style="font-size:11px;color:var(--text-muted)">${new Date(a.created_at).toLocaleDateString('pt-BR')}</span>
      </div>
      ${a.texto ? `<p style="font-size:13px;color:var(--text-muted);line-height:1.6">${esc(a.texto)}</p>` : ''}
      ${midiaAvaliacaoHTML(a)}
    </div>`).join('')
    : `<p style="color:var(--text-muted);font-size:13px;padding:16px 0">Nenhuma avaliação ainda. Seja o primeiro!</p>`;

  document.getElementById('avaliacoes-content').innerHTML = `
    <div style="background:var(--bg-card);border:1px solid var(--primary);border-radius:var(--radius-lg);padding:24px">
      <div style="display:flex;align-items:center;gap:16px;margin-bottom:20px;padding-bottom:16px;border-bottom:1px solid var(--border)">
        <div style="text-align:center">
          ${totalAv ? `<p style="font-size:48px;font-weight:900;line-height:1;color:var(--primary)">${mediaAv}</p>` : ''}
          <p style="color:#facc15;font-size:20px">${mediaAv !== '-' ? '★'.repeat(Math.round(Number(mediaAv))) + '☆'.repeat(5 - Math.round(Number(mediaAv))) : '☆☆☆☆☆'}</p>
          <p style="font-size:12px;color:var(--text-muted)">${totalAv} ${totalAv === 1 ? 'avaliação' : 'avaliações'}</p>
        </div>
      </div>
      ${formAvaliar}
      ${listaHTML}
    </div>`;

  if (_avExistente) selecionarNota(_avExistente.nota);
  if (document.getElementById('av-previews')) { renderPreviewsAvaliacao(); atualizarBonusAvaliacao(); }
}

let _notaSelecionada = 0;
window.selecionarNota = function(n) {
  _notaSelecionada = n;
  [1,2,3,4,5].forEach(i => {
    const el = document.getElementById('star-' + i);
    if (el) el.style.opacity = i <= n ? '1' : '.3';
  });
};

// Fotos/vídeo que valem pro bônus: os novos escolhidos agora ou, na
// reedição, os que já estavam na avaliação
function contagemMidiasAvaliacao() {
  return {
    fotos: _avFotos.length || (_avExistente?.fotos || []).length,
    videos: _avVideo ? 1 : (_avExistente?.videos || []).length
  };
}

window.atualizarBonusAvaliacao = function() {
  const el = document.getElementById('av-bonus');
  if (!el) return;
  const chars = (document.getElementById('av-texto')?.value || '').trim().length;
  const { fotos, videos } = contagemMidiasAvaliacao();
  const ok = (c) => c ? '<span style="color:var(--primary)">✓</span>' : '○';
  const completo = chars >= AV_MIN_CARACTERES && fotos >= 1 && videos >= 1;
  el.innerHTML = `${ok(chars >= AV_MIN_CARACTERES)} ${Math.min(chars, AV_MIN_CARACTERES)}/${AV_MIN_CARACTERES} caracteres &nbsp; ${ok(fotos >= 1)} 1 foto &nbsp; ${ok(videos >= 1)} 1 vídeo
    <br>Bônus ao aprovar: <strong style="color:var(--primary)">${completo ? 'R$ 1,00' : 'R$ 0,50'}</strong>`;
};

function renderPreviewsAvaliacao() {
  const box = document.getElementById('av-previews');
  if (!box) return;
  const antigas = _avFotos.length ? [] : (_avExistente?.fotos || []).map(u => ({ url: u, tipo: 'foto' }));
  const antigoVideo = _avVideo ? [] : (_avExistente?.videos || []).map(u => ({ url: u, tipo: 'video' }));
  const novas = _avFotos.map((f, i) => ({ url: URL.createObjectURL(f), tipo: 'foto', i }));
  const novoVideo = _avVideo ? [{ url: URL.createObjectURL(_avVideo), tipo: 'video', novo: true }] : [];
  box.innerHTML = [...antigas, ...novas, ...antigoVideo, ...novoVideo].map(m => `
    <div style="position:relative">
      ${m.tipo === 'foto'
        ? `<img src="${esc(m.url)}" style="width:64px;height:64px;object-fit:cover;border-radius:8px;border:1px solid var(--border)">`
        : `<video src="${esc(m.url)}" muted playsinline preload="metadata" style="width:96px;height:64px;object-fit:cover;border-radius:8px;background:#000;border:1px solid var(--border)"></video>`}
      ${m.i !== undefined ? `<button type="button" onclick="removerFotoAvaliacao(${m.i})" style="position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;border:none;background:#ef4444;color:#fff;font-size:12px;cursor:pointer;line-height:1">×</button>` : ''}
      ${m.novo ? `<button type="button" onclick="removerVideoAvaliacao()" style="position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;border:none;background:#ef4444;color:#fff;font-size:12px;cursor:pointer;line-height:1">×</button>` : ''}
    </div>`).join('');
}

window.adicionarFotosAvaliacao = function(input) {
  const novas = [...input.files].filter(f => f.type.startsWith('image/'));
  input.value = '';
  if (_avFotos.length + novas.length > AV_MAX_FOTOS) showToast(`Máximo de ${AV_MAX_FOTOS} fotos`, 'error');
  _avFotos = [..._avFotos, ...novas].slice(0, AV_MAX_FOTOS);
  renderPreviewsAvaliacao(); atualizarBonusAvaliacao();
};
window.removerFotoAvaliacao = function(i) {
  _avFotos.splice(i, 1);
  renderPreviewsAvaliacao(); atualizarBonusAvaliacao();
};
window.adicionarVideoAvaliacao = function(input) {
  const f = input.files[0];
  input.value = '';
  if (!f) return;
  if (!f.type.startsWith('video/')) { showToast('Escolha um arquivo de vídeo', 'error'); return; }
  if (f.size > AV_MAX_VIDEO_MB * 1024 * 1024) { showToast(`Vídeo muito grande (máx. ${AV_MAX_VIDEO_MB} MB). Grave um vídeo mais curto.`, 'error'); return; }
  _avVideo = f;
  renderPreviewsAvaliacao(); atualizarBonusAvaliacao();
};
window.removerVideoAvaliacao = function() {
  _avVideo = null;
  renderPreviewsAvaliacao(); atualizarBonusAvaliacao();
};

async function enviarArquivoAvaliacao(userId, file, extPadrao) {
  const ext = (file.name.split('.').pop() || extPadrao).toLowerCase().replace(/[^a-z0-9]/g, '') || extPadrao;
  const caminho = `${userId}/${Date.now()}-${Math.random().toString(36).slice(2, 8)}.${ext}`;
  const { error } = await supabase.storage.from('avaliacoes').upload(caminho, file, { contentType: file.type, upsert: false });
  if (error) throw error;
  return supabase.storage.from('avaliacoes').getPublicUrl(caminho).data.publicUrl;
}

window.enviarAvaliacao = async function(produtoId) {
  if (!_notaSelecionada) { showToast('Selecione uma nota de 1 a 5 ★', 'error'); return; }
  const texto = document.getElementById('av-texto').value.trim();
  const { data: { session: _sessEnviar } } = await supabase.auth.getSession();
  const user = _sessEnviar?.user || null;
  if (!user) { showToast('Faça login para avaliar', 'error'); return; }

  const btn = document.getElementById('btn-enviar-avaliacao');
  const textoBtn = btn.textContent;
  btn.disabled = true; btn.textContent = 'Enviando...';

  try {
    let fotos = _avExistente?.fotos || [];
    let videos = _avExistente?.videos || [];
    if (_avFotos.length) {
      btn.textContent = 'Enviando fotos...';
      fotos = [];
      for (const f of _avFotos) {
        const otim = typeof otimizarImagem === 'function' ? await otimizarImagem(f, { lado: 1280, qualidade: 0.8 }) : f;
        fotos.push(await enviarArquivoAvaliacao(user.id, otim, 'jpg'));
      }
    }
    if (_avVideo) {
      btn.textContent = 'Enviando vídeo...';
      videos = [await enviarArquivoAvaliacao(user.id, _avVideo, 'mp4')];
    }

    const dados = { nota: _notaSelecionada, texto, fotos, videos };
    const { error } = _avExistente
      ? await supabase.from('avaliacoes').update(dados).eq('id', _avExistente.id)
      : await supabase.from('avaliacoes').insert({ ...dados, produto_id: produtoId, usuario_id: user.id });
    if (error) throw error;

    showToast('Avaliação enviada! Ela aparece depois de aprovada 🙏', 'success');
    carregarAvaliacoes(window._produto);
  } catch (e) {
    console.error(e);
    btn.disabled = false; btn.textContent = textoBtn;
    showToast('Erro ao enviar avaliação. Tente de novo.', 'error');
  }
};

// ——— HELPER: card mini estilo AliExpress ———
function miniCard(r) {
  const preco = formatPrice(parseFloat(r.price));
  const rating = r.rating ? r.rating.toFixed(1) : '5.0';
  const vendidos = r.reviews || 0;
  const vendidosStr = vendidos >= 1000 ? (vendidos/1000).toFixed(1)+'mil' : vendidos;
  return `
    <a href="produto.html?id=${r.id}" style="text-decoration:none;display:flex;flex-direction:column;background:var(--bg-card);border:1px solid var(--border);border-radius:12px;overflow:hidden;transition:border-color .2s" onmouseover="this.style.borderColor='var(--primary)'" onmouseout="this.style.borderColor='var(--border)'">
      <div style="aspect-ratio:1;background:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative">
        ${r.discount ? `<div style="position:absolute;top:6px;left:6px;background:#e53e3e;color:#fff;font-size:10px;font-weight:900;padding:2px 6px;border-radius:5px">-${r.discount}%</div>` : ''}
        ${r.image_url
          ? `<img src="${r.image_thumb_url || r.image_url}" loading="lazy" decoding="async" style="width:100%;height:100%;object-fit:contain;padding:6px">`
          : `<span style="font-size:52px">${r.emoji || '📦'}</span>`}
      </div>
      <div style="padding:8px">
        <div style="font-size:12px;font-weight:600;color:var(--text);line-height:1.3;margin-bottom:5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden">${esc(r.name)}</div>
        <div style="display:flex;align-items:center;gap:5px;margin-bottom:5px">
          <span style="display:inline-flex;align-items:center;gap:2px;background:#1a1a00;border:1px solid rgba(250,204,21,.25);border-radius:5px;padding:1px 6px;font-size:11px;font-weight:700;color:#facc15">★ ${rating}</span>
          ${vendidos ? `<span style="font-size:11px;color:var(--text-muted)">${vendidosStr}+ vendido(s)</span>` : ''}
        </div>
        <div style="font-size:15px;font-weight:900;color:var(--primary)">${preco}</div>
        ${r.old_price ? `<div style="font-size:11px;color:var(--text-muted);text-decoration:line-through">${formatPrice(parseFloat(r.old_price))}</div>` : ''}
      </div>
    </a>`;
}

// ——— PRODUTOS RELACIONADOS (vinculados no admin) ———
async function carregarRelacionados(p) {
  const ids = p.relacionados_ids || [];
  if (!ids.length) return;

  const { data: relacionados } = await supabase
    .from('produtos')
    .select('*')
    .in('id', ids)
    .eq('ativo', true);

  if (!relacionados?.length) return;

  document.getElementById('relacionados-section').style.display = 'block';
  document.getElementById('relacionados-grid').innerHTML = relacionados.map(r => miniCard(r)).join('');
}

// ——— VOCÊ TAMBÉM PODE GOSTAR (mesma categoria, exceto o atual) ———
async function carregarTbmPodeGostar(p) {
  const { data: similares } = await supabase
    .from('produtos')
    .select('*')
    .eq('category', p.category)
    .eq('ativo', true)
    .neq('id', p.id)
    .limit(6);

  if (!similares?.length) return;

  document.getElementById('tbm-section').style.display = 'block';
  document.getElementById('tbm-grid').innerHTML = similares.map(r => miniCard(r)).join('');
}

// Link de indicação DESTE produto: produto.html?id=X&ref=CODIGO.
// O js/main.js guarda o ?ref de qualquer página, e o banco credita a
// comissão quando o pedido é entregue (só se o código existir).
window.compartilharIndicacao = async function(btn) {
  const { data: { session } } = await supabase.auth.getSession();
  if (!session?.user) {
    showToast('Entre na sua conta pra pegar seu link de indicação.', 'info');
    setTimeout(() => { window.location.href = 'login.html?redirect=' + encodeURIComponent(location.pathname.slice(1) + location.search); }, 1200);
    return;
  }
  const { data: u } = await supabase.from('usuarios').select('codigo_indicacao').eq('id', session.user.id).single();
  if (!u?.codigo_indicacao) { showToast('Seu código ainda está sendo gerado. Tente de novo em instantes.', 'error'); return; }

  const url = new URL(location.href);
  url.search = '';
  url.searchParams.set('id', window._produto?.id);
  url.searchParams.set('ref', u.codigo_indicacao);
  const link = url.toString();

  // No celular abre o compartilhar (WhatsApp etc.); no computador, copia
  if (navigator.share) {
    try { await navigator.share({ title: window._produto?.name || 'Zipshop', url: link }); return; }
    catch (e) { if (e.name === 'AbortError') return; }
  }
  try {
    await navigator.clipboard.writeText(link);
    const original = btn.textContent;
    btn.textContent = '✅ Link copiado!';
    setTimeout(() => { btn.textContent = original; }, 2000);
  } catch {
    prompt('Copie seu link:', link);
  }
};

window.changeQty = function(dir) {
  const v = _variacaoSelecionada;
  const estoque = v ? v.estoque : window._produto?.stock;
  const max = (estoque !== null && estoque !== undefined && estoque !== '') ? Number(estoque) : Infinity;
  qty = Math.max(1, Math.min(qty + dir, max || 1));
  document.getElementById('qty-display').textContent = qty;
};

// Devolve true se colocou no carrinho (o "Comprar Agora" só segue pro carrinho nesse caso)
window.doAddToCart = function(event) {
  const p = window._produto;
  if (!p) return false;
  const temVariacoes = !!document.getElementById('variacoes-container');
  // Produto com opções (variação/kit ou cor): o cliente precisa escolher,
  // senão a loja não sabe o que mandar
  if ((temVariacoes && !_variacaoSelecionada) || (!temVariacoes && !_corSelecionada && document.getElementById('cores-container'))) {
    avisarEscolherCor();
    return false;
  }
  let dados = p;
  if (_variacaoSelecionada) {
    const v = _variacaoSelecionada;
    dados = { ...p, price: precoVariacao(p, v), name: p.name + ' — ' + v.nome, variacao_id: v.id };
  } else if (_corSelecionada) {
    dados = { ...p, name: p.name + ' — ' + _corSelecionada, cor: _corSelecionada };
  }
  addToCart(dados.id, qty, dados, event);
  return true;
};

window.showTab = function(tab) {
  ['desc','specs','avaliacoes'].forEach(t => {
    document.getElementById('pane-' + t).style.display = t === tab ? 'block' : 'none';
    document.getElementById('tab-' + t).style.borderBottomColor = t === tab ? 'var(--primary)' : 'transparent';
    document.getElementById('tab-' + t).style.color = t === tab ? 'var(--primary)' : 'var(--text-muted)';
  });
  if (tab === 'avaliacoes') carregarAvaliacoes(window._produto);
};

render();
</script>
