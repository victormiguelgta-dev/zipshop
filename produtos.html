<!DOCTYPE html>
<html lang="pt-BR">
<head>
<link rel="preconnect" href="https://kkliwdphrdbguclsvxcw.supabase.co">
<link rel="dns-prefetch" href="https://kkliwdphrdbguclsvxcw.supabase.co">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="base" content="">
  <title>Produtos — Zipshop</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="navbar"></div>

<main class="lista-produtos">
  <div class="lp-topo">
    <div class="lp-titulo sr-only">
      <h1 id="lp-titulo">Todos os produtos</h1>
      <span id="count-label" class="lp-contagem"></span>
    </div>

    <label class="lp-busca">
      <span aria-hidden="true">🔍</span>
      <input type="search" id="search-prod" placeholder="Buscar nesta lista..." oninput="applyFilters()" autocomplete="off">
    </label>

    <div class="lp-cats" id="cat-pills" aria-label="Categorias"></div>

    <div class="lp-barra">
      <div class="lp-ordem" role="tablist" aria-label="Ordenar">
        <button type="button" data-ordem="relevance" class="ativo" onclick="ordenar('relevance')">Relevância</button>
        <button type="button" data-ordem="vendidos" onclick="ordenar('vendidos')">Mais vendidos</button>
        <button type="button" data-ordem="price" id="ordem-preco" onclick="ordenar('price')">Preço <span id="seta-preco">⇅</span></button>
      </div>
      <button type="button" class="lp-btn-filtro" onclick="abrirFiltros()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 5h18l-7 8v6l-4 2v-8z"/></svg>
        Filtrar <span class="lp-badge" id="badge-filtros" hidden>0</span>
      </button>
    </div>

    <div class="lp-chips" id="active-chips"></div>
  </div>

  <div class="product-grid" id="products-grid"></div>

  <div id="empty-msg" class="lp-vazio" hidden>
    <div class="lp-vazio-icone">🛍️</div>
    <p class="lp-vazio-titulo">Nenhum produto encontrado</p>
    <p class="lp-vazio-sub">Tente tirar algum filtro ou buscar outro termo.</p>
    <button type="button" class="btn btn-primary" onclick="clearFilters(true)">Ver todos os produtos</button>
  </div>
</main>

<!-- GAVETA DE FILTROS (sobe de baixo no celular, abre na lateral no computador) -->
<div class="lp-gaveta-fundo" id="gaveta-fundo" onclick="fecharFiltros()" hidden></div>
<aside class="lp-gaveta" id="gaveta" aria-label="Filtros" aria-hidden="true">
  <div class="lp-gaveta-topo">
    <strong>Filtrar</strong>
    <button type="button" class="lp-fechar" onclick="fecharFiltros()" aria-label="Fechar">✕</button>
  </div>
  <div class="lp-gaveta-corpo">
    <section id="secao-marcas">
      <p class="lp-secao-titulo">Marca</p>
      <div class="lp-opcoes" id="brand-filters"></div>
    </section>
    <section>
      <p class="lp-secao-titulo">Faixa de preço (R$)</p>
      <div class="lp-preco">
        <input type="number" id="preco-min" inputmode="numeric" min="0" placeholder="Mínimo">
        <span>–</span>
        <input type="number" id="preco-max" inputmode="numeric" min="0" placeholder="Máximo">
      </div>
      <div class="lp-opcoes" id="faixas-preco"></div>
    </section>
    <section>
      <p class="lp-secao-titulo">Serviços e promoções</p>
      <div class="lp-opcoes">
        <button type="button" class="lp-opcao" data-flag="oferta" onclick="alternarFlag(this)">⚡ Em oferta</button>
        <button type="button" class="lp-opcao" data-flag="frete" onclick="alternarFlag(this)">🚚 Frete grátis</button>
        <button type="button" class="lp-opcao" data-flag="rapida" onclick="alternarFlag(this)">⚡ Entrega rápida</button>
        <button type="button" class="lp-opcao" data-flag="estoque" onclick="alternarFlag(this)">✅ Só com estoque</button>
      </div>
    </section>
  </div>
  <div class="lp-gaveta-rodape">
    <button type="button" class="btn btn-outline" onclick="clearFilters()">Limpar</button>
    <button type="button" class="btn btn-primary" id="btn-ver-resultados" onclick="aplicarGaveta()">Ver produtos</button>
  </div>
</aside>

<div id="footer"></div>

<script src="js/cart.js"></script>
<script src="js/main.js"></script>
<script type="module">
function esc(str) {
  if (str === null || str === undefined) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');
}

import { supabase } from './js/supabase-config.js';
import { loadProducts, formatPrice, loadSinonimos, estaEsgotado, esgotadosNoFim } from './js/data.js';
import { getFavoritosIds, toggleFavorito } from './js/favoritos.js';

// Estado da lista (categoria única, igual Shopee; marcas e opções na gaveta)
const params = new URLSearchParams(location.search);
const estado = {
  cat: params.get('cat') || '',
  marcas: new Set(),
  min: null,
  max: null,
  flags: new Set(params.get('deal') ? ['oferta'] : []),
  ordem: 'relevance',
  precoAsc: true
};
// Rascunho da gaveta: só vale ao tocar em "Ver produtos"
let rascunho = null;

let PRODUCTS = [];
let CATEGORIAS = [];
let _favoritosIds = new Set();
let SINONIMOS = [];
window._produtosCache = {};

window.toggleFavoritoCard = async function(produtoId, btn) {
  const r = await toggleFavorito(produtoId);
  if (r.precisaLogin) { window.location.href = 'login.html'; return; }
  btn.textContent = r.favoritado ? '💚' : '🤍';
  btn.dataset.fav = r.favoritado ? '1' : '0';
};

// ——— Categorias em pílulas (com a foto do painel) ———
function renderCategorias() {
  const box = document.getElementById('cat-pills');
  const pilula = (nome, rotulo, img) => `
    <button type="button" class="lp-cat${estado.cat === nome ? ' ativo' : ''}" data-cat="${esc(nome)}" onclick="escolherCategoria(this.dataset.cat)">
      ${img}<span>${esc(rotulo)}</span>
    </button>`;
  box.innerHTML = pilula('', 'Todos', '<span class="lp-cat-img">🛍️</span>') +
    CATEGORIAS.map(c => pilula(c.name, c.name,
      c.image_url ? `<img class="lp-cat-img" src="${esc(c.image_url)}" alt="" loading="lazy">` : `<span class="lp-cat-img">${esc(c.emoji || '📦')}</span>`
    )).join('');
  box.querySelector('.ativo')?.scrollIntoView({ inline: 'center', block: 'nearest' });
}
window.escolherCategoria = function(nome) {
  estado.cat = nome;
  const url = new URL(location.href);
  if (nome) url.searchParams.set('cat', nome); else url.searchParams.delete('cat');
  history.replaceState(null, '', url);
  renderCategorias();
  applyFilters();
};

// ——— Ordenação (abas) ———
window.ordenar = function(ordem) {
  if (ordem === 'price') estado.precoAsc = estado.ordem === 'price' ? !estado.precoAsc : true;
  estado.ordem = ordem;
  document.querySelectorAll('.lp-ordem button').forEach(b => b.classList.toggle('ativo', b.dataset.ordem === ordem));
  document.getElementById('seta-preco').textContent = ordem === 'price' ? (estado.precoAsc ? '↑' : '↓') : '⇅';
  applyFilters();
};

// ——— Gaveta de filtros ———
function faixasPreco() {
  const maior = Math.max(0, ...PRODUCTS.map(p => p.price));
  const base = [[0, 50], [50, 100], [100, 300], [300, null]];
  return base.filter(([a]) => a < maior || a === 0);
}
function rotuloFaixa([a, b]) {
  if (a === 0) return `Até R$ ${b}`;
  if (b === null) return `Acima de R$ ${a}`;
  return `R$ ${a} a ${b}`;
}
function renderGaveta() {
  const r = rascunho;
  const marcas = [...new Set(PRODUCTS.map(p => (p.brand || '').trim()).filter(Boolean))].sort((a, b) => a.localeCompare(b, 'pt-BR'));
  document.getElementById('secao-marcas').hidden = marcas.length < 2;
  document.getElementById('brand-filters').innerHTML = marcas.map(m =>
    `<button type="button" class="lp-opcao${r.marcas.has(m) ? ' ativo' : ''}" data-marca="${esc(m)}" onclick="alternarMarca(this)">${esc(m)}</button>`).join('');
  document.getElementById('faixas-preco').innerHTML = faixasPreco().map((f, i) => {
    const ativo = r.min === f[0] && r.max === f[1];
    return `<button type="button" class="lp-opcao${ativo ? ' ativo' : ''}" onclick="escolherFaixa(${i})">${rotuloFaixa(f)}</button>`;
  }).join('');
  document.getElementById('preco-min').value = r.min ?? '';
  document.getElementById('preco-max').value = r.max ?? '';
  document.querySelectorAll('.lp-opcao[data-flag]').forEach(b => b.classList.toggle('ativo', r.flags.has(b.dataset.flag)));
  atualizarBotaoResultados();
}
function lerPrecosDigitados() {
  const min = parseFloat(document.getElementById('preco-min').value);
  const max = parseFloat(document.getElementById('preco-max').value);
  rascunho.min = isNaN(min) ? null : min;
  rascunho.max = isNaN(max) ? null : max;
}
function atualizarBotaoResultados() {
  const n = filtrar(rascunho).length;
  document.getElementById('btn-ver-resultados').textContent = `Ver ${n} produto${n !== 1 ? 's' : ''}`;
}
window.abrirFiltros = function() {
  rascunho = { ...estado, marcas: new Set(estado.marcas), flags: new Set(estado.flags) };
  renderGaveta();
  document.getElementById('gaveta-fundo').hidden = false;
  const g = document.getElementById('gaveta');
  g.classList.add('aberta'); g.setAttribute('aria-hidden', 'false');
  document.body.style.overflow = 'hidden';
};
window.fecharFiltros = function() {
  document.getElementById('gaveta-fundo').hidden = true;
  const g = document.getElementById('gaveta');
  g.classList.remove('aberta'); g.setAttribute('aria-hidden', 'true');
  document.body.style.overflow = '';
};
window.alternarMarca = function(btn) {
  const m = btn.dataset.marca;
  rascunho.marcas.has(m) ? rascunho.marcas.delete(m) : rascunho.marcas.add(m);
  btn.classList.toggle('ativo');
  atualizarBotaoResultados();
};
window.alternarFlag = function(btn) {
  const f = btn.dataset.flag;
  rascunho.flags.has(f) ? rascunho.flags.delete(f) : rascunho.flags.add(f);
  btn.classList.toggle('ativo');
  atualizarBotaoResultados();
};
window.escolherFaixa = function(i) {
  const [a, b] = faixasPreco()[i];
  const mesma = rascunho.min === a && rascunho.max === b;
  rascunho.min = mesma ? null : a;
  rascunho.max = mesma ? null : b;
  renderGaveta();
};
['preco-min', 'preco-max'].forEach(id => document.getElementById(id).addEventListener('input', () => {
  lerPrecosDigitados();
  document.querySelectorAll('#faixas-preco .lp-opcao').forEach(b => b.classList.remove('ativo'));
  atualizarBotaoResultados();
}));
window.aplicarGaveta = function() {
  lerPrecosDigitados();
  estado.marcas = rascunho.marcas; estado.flags = rascunho.flags;
  estado.min = rascunho.min; estado.max = rascunho.max;
  fecharFiltros();
  applyFilters();
};
window.clearFilters = function(tudo = false) {
  const limpo = { marcas: new Set(), flags: new Set(), min: null, max: null };
  if (rascunho && !tudo) { Object.assign(rascunho, limpo); renderGaveta(); return; }
  Object.assign(estado, limpo);
  if (tudo) {
    document.getElementById('search-prod').value = '';
    escolherCategoria('');
  } else applyFilters();
};

// ——— Chips dos filtros ativos (cada um com ✕) ———
function renderChips() {
  const chips = [];
  estado.marcas.forEach(m => chips.push({ t: m, rm: () => estado.marcas.delete(m) }));
  if (estado.min !== null || estado.max !== null) {
    const t = estado.min !== null && estado.max !== null ? `${formatPrice(estado.min)} a ${formatPrice(estado.max)}`
      : estado.min !== null ? `Acima de ${formatPrice(estado.min)}` : `Até ${formatPrice(estado.max)}`;
    chips.push({ t, rm: () => { estado.min = null; estado.max = null; } });
  }
  const nomesFlag = { oferta: 'Em oferta', frete: 'Frete grátis', rapida: 'Entrega rápida', estoque: 'Só com estoque' };
  estado.flags.forEach(f => chips.push({ t: nomesFlag[f], rm: () => estado.flags.delete(f) }));
  window._chipsRemover = chips.map(c => c.rm);
  const box = document.getElementById('active-chips');
  box.innerHTML = chips.map((c, i) => `<button type="button" class="lp-chip" onclick="removerChip(${i})">${esc(c.t)} <span aria-hidden="true">✕</span></button>`).join('') +
    (chips.length > 1 ? `<button type="button" class="lp-chip-limpar" onclick="clearFilters()">Limpar tudo</button>` : '');
  const badge = document.getElementById('badge-filtros');
  badge.hidden = !chips.length; badge.textContent = chips.length;
}
window.removerChip = function(i) { window._chipsRemover[i]?.(); applyFilters(); };

// ——— Filtro + ordenação ———
function filtrar(f) {
  const q = document.getElementById('search-prod').value.trim().toLowerCase();
  const categoriasSinonimo = q
    ? SINONIMOS.filter(s => s.termo.toLowerCase() === q).map(s => s.categoria.toLowerCase())
    : [];
  return PRODUCTS.filter(p => {
    if (estado.cat && p.category !== estado.cat) return false;
    if (f.marcas.size && !f.marcas.has((p.brand || '').trim())) return false;
    if (f.min !== null && p.price < f.min) return false;
    if (f.max !== null && p.price > f.max) return false;
    if (f.flags.has('oferta') && !(p.oferta || p.discount > 0)) return false;
    if (f.flags.has('frete') && !p.frete_gratis) return false;
    if (f.flags.has('rapida') && (p.tipo_estoque === 'dropshipping' || !p.entrega_24h)) return false;
    if (f.flags.has('estoque') && estaEsgotado(p)) return false;
    if (q) {
      const texto = `${p.name} ${p.brand || ''} ${p.category || ''} ${p.desc || ''}`.toLowerCase();
      if (!texto.includes(q) && !categoriasSinonimo.includes((p.category || '').toLowerCase())) return false;
    }
    return true;
  });
}

function cardHTML(p) {
  const esgotado = estaEsgotado(p);
  const fav = _favoritosIds && _favoritosIds.has(p.id);
  return `
    <a href="produto.html?id=${p.id}" class="product-card${esgotado ? ' esgotado' : ''}">
      <div class="product-card-img" style="background:linear-gradient(135deg,#1e3a6e,#2563eb)">
        ${p.discount ? `<div class="discount-badge">-${p.discount}%</div>` : ''}
        ${esgotado ? '<div class="esgotado-badge">Esgotado</div>' : ''}
        <button onclick="event.preventDefault(); toggleFavoritoCard(${p.id}, this)" class="fav-btn" data-fav="${fav ? '1' : '0'}" aria-label="Favoritar">${fav ? '💚' : '🤍'}</button>
        ${p.image_url ? `<img src="${esc(p.image_thumb_url || p.image_url)}" loading="lazy" decoding="async" style="width:100%;height:100%;object-fit:cover">` : `<span style="font-size:64px">${esc(p.emoji)}</span>`}
      </div>
      <div class="product-card-body">
        <div class="product-brand">${esc(p.brand)}</div>
        <div class="product-name">${esc(p.name)}</div>
        <div class="product-rating-row">
          <span class="rating-pill">★ ${p.rating ? p.rating.toFixed(1) : '5.0'}</span>
          ${p.reviews ? `<span class="product-sold">${p.reviews >= 1000 ? (p.reviews/1000).toFixed(1)+'mil' : p.reviews}+ vendido(s)</span>` : ''}
        </div>
        ${p.oldPrice ? `<div class="product-price-old">${formatPrice(p.oldPrice)}</div>` : ''}
        <div class="product-price">${p.temVariacoes ? '<span style="font-size:11px;font-weight:600;color:var(--text-muted)">a partir de </span>' : ''}${formatPrice(p.price)}</div>
        <div class="product-installment">ou 10x de ${formatPrice(p.price/10)}</div>
        <div style="display:flex;gap:4px;flex-wrap:wrap;margin-top:4px">
          ${p.frete_gratis ? '<span style="font-size:10px;background:#1a3a1a;color:#4ade80;padding:2px 6px;border-radius:4px;font-weight:700">🚚 Frete Grátis</span>' : ''}
          ${p.tipo_estoque === 'dropshipping' ? '<span style="font-size:10px;background:#1a2a3a;color:#93c5fd;padding:2px 6px;border-radius:4px;font-weight:700">🚚 5 a 15 dias</span>' : (p.entrega_24h ? '<span style="font-size:10px;background:#1a2a3a;color:#60a5fa;padding:2px 6px;border-radius:4px;font-weight:700">⚡ 24h</span>' : '')}
        </div>
      </div>
      <div class="product-card-footer">
        ${esgotado
          ? '<button class="btn btn-outline btn-full btn-sm" disabled onclick="event.preventDefault()">Sem estoque</button>'
          : `<button class="btn btn-primary btn-full btn-sm" onclick="event.preventDefault(); addToCart(${p.id}, 1, window._produtosCache[${p.id}], event)">🛒 Adicionar</button>`}
      </div>
    </a>`;
}

window.applyFilters = () => {
  let list = filtrar(estado);
  if (estado.ordem === 'price') list.sort((a, b) => estado.precoAsc ? a.price - b.price : b.price - a.price);
  else if (estado.ordem === 'vendidos') list.sort((a, b) => (b.reviews || 0) - (a.reviews || 0));
  list = esgotadosNoFim(list);

  const q = document.getElementById('search-prod').value.trim();
  document.getElementById('lp-titulo').textContent = estado.cat || (q ? `Resultados para "${q}"` : (estado.flags.has('oferta') && estado.flags.size === 1 ? 'Ofertas do dia' : 'Todos os produtos'));
  document.getElementById('count-label').textContent = `${list.length} produto${list.length !== 1 ? 's' : ''}`;
  renderChips();

  const grid = document.getElementById('products-grid');
  const empty = document.getElementById('empty-msg');
  empty.hidden = list.length > 0;
  list.forEach(p => { window._produtosCache[p.id] = p; });
  grid.innerHTML = list.map(cardHTML).join('');
};

window.addEventListener('keydown', e => { if (e.key === 'Escape') fecharFiltros(); });

// Carrega e renderiza
const [prods, favs, sins, cats] = await Promise.all([
  loadProducts(),
  getFavoritosIds(),
  loadSinonimos(),
  supabase.from('categorias').select('name, image_url, emoji').eq('ativo', true).order('name').then(r => r.data || []).catch(() => [])
]);
PRODUCTS = prods; _favoritosIds = favs; SINONIMOS = sins; CATEGORIAS = cats;
const busca = params.get('q') || '';
if (busca) document.getElementById('search-prod').value = busca;
renderCategorias();
applyFilters();
</script>
</body>
</html>
